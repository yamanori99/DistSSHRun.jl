# Commands measured by bench/compile/measure.jl. No SSH.
# Scripts live under bench/compile/fixtures. Child cwd is the repo root so the
# CLI project root matches the Manifest (worker environment verification).
package = "DistSSHRun"

[[command]]
name = "help"
args = ["--help"]

[[command]]
name = "go"
args = ["go", "bench/compile/fixtures/pi_echo.jl"]

[[command]]
name = "drive"
args = ["drive", "parent:2", "bench/compile/fixtures/drive_square.jl"]
