version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"

  # Actions lint CLIs: actionlint / pinact (gomod) and zizmor (pip).
  # tools.go keeps the direct requires; Dependabot does not update Go
  # `tool` directives yet (dependabot-core#12050).
  - package-ecosystem: gomod
    directory: "/.github/actions-lint"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      actions-lint-go:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: "/.github/actions-lint"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      actions-lint-pip:
        patterns:
          - "*"

  # Ignore stdlibs, not an allow-list of third-party names. A new
  # registry dep is picked up automatically; a new stdlib [deps]
  # entry should be added here. The Julia updater appends `< 0.0.1`
  # (union with 0.0.0) for the pre-1.10 Pkg.test sandbox. This package
  # is Julia 1.13, so that clause is wrong. Keep stdlib [compat] at
  # the Julia floor by hand.
  - package-ecosystem: julia
    directories:
      - "/"
      - "/docs"
      - "/lib/DistSSHBase"
      - "/lib/DistSSHUp"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      - dependency-name: Dates
      - dependency-name: Pkg
      - dependency-name: TOML
      - dependency-name: Test
