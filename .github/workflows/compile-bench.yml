# Daily measurement on main. Not a PR check.
# Appends one sample per slot per UTC day to bench-data unless that slot already
# has this commit on this UTC day. The README and summary.csv are rendered after
# the three slots. A 1.13 failure on main opens "Compile bench failed". A
# skipped run does not close it. The 1.14-pre and nightly jobs stay
# continue-on-error and are not that issue. Renderer-only changes use Compile
# bench render; that workflow rebuilds the page and does not measure.
name: Compile bench

on:
  workflow_dispatch:
  # Daily 06:00 JST (UTC 21:00). Same slot as CI weekly used for compile bench.
  schedule:
    - cron: "0 21 * * *"

concurrency:
  group: compile-bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compile-bench:
    name: Compile bench (1.13, ubuntu-latest, x64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.13"
      - uses: ./.github/actions/compile-bench
        with:
          slot: "1.13"
          token: ${{ github.token }}

  compile-bench-1-14-pre:
    name: Compile bench (1.14-pre, ubuntu-latest, x64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "~1.14.0-0"
      - uses: ./.github/actions/compile-bench
        with:
          slot: "1.14-pre"
          token: ${{ github.token }}

  compile-bench-master:
    name: Compile bench (nightly, ubuntu-latest, x64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "nightly"
      - uses: ./.github/actions/compile-bench
        with:
          slot: "nightly"
          token: ${{ github.token }}

  render:
    name: Render bench-data
    needs:
      - compile-bench
      - compile-bench-1-14-pre
      - compile-bench-master
    if: always() && github.ref == 'refs/heads/main'
    # Same queue as Deploy docs. Both jobs push gh-pages.
    concurrency:
      group: docs-gh-pages
      cancel-in-progress: false
      # actionlint 1.7.12 does not know concurrency.queue yet. GitHub does.
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.13"
      - name: Render compile bench
        env:
          BENCH_TOKEN: ${{ github.token }}
          BENCH_PUSH: "1"
        run: bash .github/compile-bench-render.sh

  source-churn-render:
    name: Source churn render
    needs:
      - render
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.13"
      - name: Render source churn
        env:
          BENCH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          julia --startup-file=no --project=bench/compile -e 'using Pkg; Pkg.instantiate()'
          dest="${RUNNER_TEMP}/bench-data"
          rm -rf "$dest"
          url="https://github.com/${GITHUB_REPOSITORY}.git"
          basic="$(printf 'x-access-token:%s' "$BENCH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${basic}"
          auth=(-c "http.extraheader=AUTHORIZATION: basic ${basic}")
          net=(-c http.connectTimeout=10 -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30)
          rc=0
          git "${net[@]}" "${auth[@]}" ls-remote --exit-code --heads "$url" bench-data >/dev/null || rc=$?
          if [ "$rc" = "2" ]; then
            git "${net[@]}" "${auth[@]}" clone --branch main --single-branch "$url" "$dest"
            git -C "$dest" checkout --orphan bench-data
            git -C "$dest" rm -rf . >/dev/null 2>&1 || true
          elif [ "$rc" != "0" ]; then
            exit "$rc"
          else
            git "${net[@]}" "${auth[@]}" clone --branch bench-data --single-branch "$url" "$dest"
          fi
          git -C "$dest" config http.extraheader "AUTHORIZATION: basic ${basic}"
          julia --startup-file=no --project=bench/compile bench/compile/churn_render.jl \
            --out-dir "$dest/churn" --append-readme "$dest/README.md"
          git -C "$dest" config user.name "github-actions[bot]"
          git -C "$dest" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$dest" add README.md churn/
          if git -C "$dest" diff --cached --quiet; then
            echo "bench-data churn unchanged"
            exit 0
          fi
          git -C "$dest" commit -m "Render source churn."
          for attempt in 1 2 3 4 5 6; do
            if git "${net[@]}" -C "$dest" push origin HEAD:bench-data; then
              exit 0
            fi
            git "${net[@]}" -C "$dest" pull --rebase origin bench-data || { git -C "$dest" rebase --abort || true; exit 1; }
            [ "$attempt" -lt 6 ] && sleep "$attempt"
          done
          git "${net[@]}" -C "$dest" push origin HEAD:bench-data

  notify-bench:
    needs: compile-bench
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: notify-bench
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open or close tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ needs.compile-bench.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/compile-bench-notify.sh
