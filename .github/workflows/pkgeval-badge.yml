name: PkgEval badge

# This repository updates its own badge. The restyle is DistSSHKit's
# docs/pkgeval-badge.jl. That script runs in a read-only job. Only the
# SVG is passed to the job that can push. A missing Nanosoldier badge
# is not written.
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      present: ${{ steps.badge.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yamanori99/DistSSHKit.jl
          ref: main
          path: distsshkit
          persist-credentials: false
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.13"
      - name: Refresh badge
        id: badge
        run: |
          julia --startup-file=no distsshkit/docs/pkgeval-badge.jl DistSSHRun pkgeval.svg
          if [[ -f pkgeval.svg ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.badge.outputs.present == 'true'
        with:
          name: pkgeval-svg
          path: pkgeval.svg
          if-no-files-found: error

  commit:
    needs: generate
    if: needs.generate.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pkgeval-svg
          path: docs/src/assets
      - name: Commit if the badge changed
        run: |
          grep -q 'PkgEval' docs/src/assets/pkgeval.svg
          git add docs/src/assets/pkgeval.svg
          if git diff --cached --quiet; then
            echo "PkgEval badge unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh PkgEval badge from Nanosoldier."
          git pull --rebase origin main
          git push
