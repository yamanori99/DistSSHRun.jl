name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel redundant runs on the same branch/PR.
# Ubuntu 1.14-pre (setup-julia ~1.14.0-0) Pkg.test, Aqua, and JETLS follow
# the heavy gate, including ordinary pull requests. Linux SSH E2E 1.14-pre
# follows the E2E path filter (continue-on-error). A Project.toml version
# increase (see version-cut.sh) also runs Ubuntu nightly and Aqua on nightly.
# macOS 1.14-pre Pkg.test follows the heavy gate and is required. macOS
# nightly stays on CI weekly. WSL2 1.13 Pkg.test runs on a main
# push and CI weekly, not on a pull request.
# Ordinary pull requests skip DistSSHBase unless lib/DistSSHBase, root
# Project.toml, .github/julia-slots.env, this file, or .github/actions
# changed (`**/*.md` excluded). DistSSHUp also runs when lib/DistSSHUp
# changed. A main push, version-cut PR, workflow_dispatch, and CI weekly
# still run both. Codecov stays a main push.
# Registry install follows the heavy gate, including ordinary pull requests.
# PkgEval follows the heavy gate
# (ordinary PRs too) and is continue-on-error. No label is involved.
# A main push that changes only Project.toml and NEWS.md, and raises
# version, skips Test and does not start Linux E2E.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  # `Pkg.test` 1.13 on a pull request is ubuntu-latest and macos-latest.
  # WSL2 Ubuntu is a main push and CI weekly, not a pull request.
  # macOS is required. The macOS job exercises `ps -o lstart=`
  # in kit_process_start_key (no /proc). Coverage uploads from Ubuntu only.
  # Run's check titles are `DistSSHRun (...)`, the same shape as DistSSHBase
  # and DistSSHUp. macOS 1.13 runs Base, then Up, then Run, one runner at a
  # time. A skipped Base or Up does not skip the next (`!cancelled()` and
  # `!failure()`, and Run also needs Base so a Base failure still blocks it).
  # Runic, JETLS 1.13, and Aqua 1.13 start after detect. Pkg.test, Registry,
  # PkgEval, downstream, and SSH E2E start only after those three succeed.
  # An `if` drops the implicit success() check, so each of those jobs names
  # needs.*.result == 'success'. 1.14-pre Aqua and JETLS stay
  # continue-on-error and do not hold the hosts. Ubuntu stays parallel once
  # the gate is green. Downstream is one
  # matrix (DistSSHQueue, DistSSHKit). Each required DistSSHUp and
  # DistSSHBase title is its own job (Ubuntu, macOS, Ubuntu SSH
  # E2E). WSL2 titles run on a main push and CI weekly, not a pull request.
  # A closed gate skips that job, so the check is skipping. Do not
  # put those titles in one matrix: a job-level if runs before the matrix
  # expands, and the required names never report.
  # Coverage uploads from the Ubuntu Run job and the Ubuntu DistSSHBase /
  # DistSSHUp jobs (flag pkgtest, main push).
  # Slow SSH E2E kit parents are `E2E weekly`
  # (macos-15-intel Colima, not this job).
  # PRs run `DistSSHRun (1.13, ubuntu-latest → ubuntu-26.04)` in this workflow.
  # `DistSSHRun (1.14-pre, ubuntu-latest → ubuntu-26.04)` is continue-on-error.
  # One detect job; markdown-only / allowlisted PRs skip heavy jobs (UI: skipping).
  # Required check names include the Julia version and the architecture.
  # Codecov (flag pkgtest): main push only — not on pull_request.
  # cache-scratchspaces: false — registry_updates.toml in scratchspaces can
  # poison Pkg.Registry.update on 1.13 if restored corrupt.
  # Aqua / JETLS / Runic share this workflow so the Test badge is the PR gate.
  # `.github/workflows/runic.yml` keeps the monthly schedule.
  # Linux E2E (1.13 required, 1.14-pre continue-on-error): path filter on PR /
  # main push; always on a version
  # increase and dispatch. JETLS uses `.github/actions/jetls-check` (no nested
  # cache; julia-actions/cache#236). JETLS 2026-10-26 supports 1.12.2 through
  # 1.14. The required job is 1.13. The 1.14-pre job is continue-on-error
  # and is not a required check.
  detect:
    name: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      heavy: ${{ steps.heavy.outputs.heavy }}
      version_cut: ${{ steps.heavy.outputs.version_cut }}
      e2e: ${{ steps.gate.outputs.e2e }}
      coverage: ${{ steps.gate.outputs.coverage }}
      # DistSSHBase / DistSSHUp path gates. True except on an ordinary pull request.
      base: ${{ steps.gate.outputs.base }}
      up: ${{ steps.gate.outputs.up }}
      # Queue's Linux SSH E2E against this checkout. Not the path-filtered `e2e` gate.
      queue_e2e: ${{ steps.gate.outputs.queue_e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-heavy
        id: heavy
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            e2e:
              - "src/**"
              - "lib/**"
              - "test/**"
              - "!test/**/*.md"
              - "demos/**"
              - "!demos/**/*.md"
              - "testenv/**"
              - "!testenv/**/*.md"
              - "Project.toml"
              - ".github/julia-slots.env"
              - ".github/workflows/CI.yml"
            base:
              - "lib/DistSSHBase/**"
              - "!lib/DistSSHBase/**/*.md"
              - "Project.toml"
              - ".github/julia-slots.env"
              - ".github/workflows/CI.yml"
              - ".github/actions/**"
              - "!.github/actions/**/*.md"
            up:
              - "lib/DistSSHUp/**"
              - "!lib/DistSSHUp/**/*.md"
      - id: gate
        env:
          FILTER_E2E: ${{ steps.filter.outputs.e2e }}
          FILTER_BASE: ${{ steps.filter.outputs.base }}
          FILTER_UP: ${{ steps.filter.outputs.up }}
          CUT: ${{ steps.heavy.outputs.version_cut }}
          HEAVY: ${{ steps.heavy.outputs.heavy }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$HEAVY" = "false" ]; then
            echo "e2e=false" >> "$GITHUB_OUTPUT"
            echo "coverage=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$CUT" = "true" ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "e2e=${FILTER_E2E}" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$CUT" = "true" ]; then
            echo "coverage=true" >> "$GITHUB_OUTPUT"
          else
            echo "coverage=false" >> "$GITHUB_OUTPUT"
          fi
          # Version-cut PRs, main pushes, and workflow_dispatch. Ordinary PRs stay false.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$CUT" = "true" ] || { [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; }; then
            echo "queue_e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "queue_e2e=false" >> "$GITHUB_OUTPUT"
          fi
          # Ordinary pull requests only. Push, dispatch, and a version cut run both.
          # CI weekly is a separate workflow and does not read these outputs.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] || [ "$CUT" = "true" ]; then
            echo "base=true" >> "$GITHUB_OUTPUT"
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            base="${FILTER_BASE:-false}"
            up_paths="${FILTER_UP:-false}"
            echo "base=${base}" >> "$GITHUB_OUTPUT"
            if [ "$base" = "true" ] || [ "$up_paths" = "true" ]; then
              echo "up=true" >> "$GITHUB_OUTPUT"
            else
              echo "up=false" >> "$GITHUB_OUTPUT"
            fi
          fi
  test:
    name: DistSSHRun (1.13, ubuntu-latest, x64)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Codecov OIDC on main push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test
        with:
          coverage: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          upload: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  test-macos:
    name: DistSSHRun (1.13, macos-latest, aarch64)
    needs: [detect, runic, jetls, aqua, base-test-macos, up-test-macos]
    # success() is false when a needed job is skipped, which would skip Run
    # after a path-gated Base or Up. Failure still blocks; skip does not.
    # The static gate is result == success, so a skipped Runic does not start Run.
    if: ${{ needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success' && !cancelled() && !failure() }}
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test

  test-wsl:
    name: DistSSHRun (1.13, WSL2 ubuntu-24.04, x64)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success' && github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/wsl-install
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        timeout-minutes: 10
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          # Already registered by ./.github/actions/wsl-install. See
          # wsl-install.ps1 for #43, #96, and #134. This step must not run
          # `wsl --install` or apt-get. A stuck wsl.exe keeps stdio open, so
          # timeout-minutes does not reap it.
          use-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache/wsl-julia
          # ci's depot, compiled files included. SSH E2E uses wsl-julia.
          key: wsl-julia-1.13-${{ hashFiles('Project.toml', 'test/Project.toml', '.github/julia-slots.env') }}
      - name: Pkg.test in WSL2
        shell: wsl-bash {0}
        run: ./.github/wsl-julia.sh 1.13 julia --project=. -e 'using Pkg; Pkg.test()'

  downstream:
    name: Downstream (${{ matrix.pkg }}@main, 1.13)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pkg: [DistSSHQueue, DistSSHKit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yamanori99/${{ matrix.pkg }}.jl
          ref: main
          path: downstream
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Public Run names in downstream src
        env:
          DOWNSTREAM_SRC: ${{ github.workspace }}/downstream/src
        run: julia --startup-file=no --project=. .github/downstream_public.jl "$DOWNSTREAM_SRC"
      - name: Pkg.test downstream against this checkout
        env:
          PKG: ${{ matrix.pkg }}
          UPSTREAM: ${{ github.workspace }}
          DOWNSTREAM: ${{ github.workspace }}/downstream
          UPSTREAM_PKG: DistSSHRun
        run: |
          julia --startup-file=no -e '
            using Pkg
            upstream = ENV["UPSTREAM"]
            downstream = ENV["DOWNSTREAM"]
            name = Symbol(ENV["UPSTREAM_PKG"])
            Pkg.activate(joinpath(downstream, "test"))
            Pkg.develop(PackageSpec(path = upstream))
            Pkg.instantiate()
            Core.eval(Main, Expr(:using, Expr(:., name)))
            dir = pkgdir(getfield(Main, name))
            dir === nothing && error(string(name, " has no pkgdir"))
            loaded = realpath(dir)
            expected = realpath(upstream)
            loaded == expected || error(string(name, " loaded from ", loaded))
            Pkg.activate(downstream)
            Pkg.test(ENV["PKG"])
          '

  up-test-ubuntu:
    name: DistSSHUp (1.13, ubuntu-latest, x64)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.detect.outputs.up == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Codecov OIDC on main push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Pkg.test
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            julia --project=lib/DistSSHUp -e 'using Pkg; Pkg.test(; coverage=true)'
          else
            julia --project=lib/DistSSHUp -e 'using Pkg; Pkg.test()'
          fi
      - uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38 # v1.2.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          directories: lib/DistSSHUp/src
      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          slug: ${{ github.repository }}
          use_oidc: true
          flags: pkgtest
          fail_ci_if_error: true

  up-test-macos:
    name: DistSSHUp (1.13, macos-latest, aarch64)
    needs: [detect, runic, jetls, aqua, base-test-macos]
    # A skipped Base must not skip Up. A failed Base still does.
    if: ${{ needs.detect.outputs.heavy == 'true' && needs.detect.outputs.up == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success' && !cancelled() && !failure() }}
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Pkg.test
        run: julia --project=lib/DistSSHUp -e 'using Pkg; Pkg.test()'

  up-test-wsl:
    name: DistSSHUp (1.13, WSL2 ubuntu-24.04, x64)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.detect.outputs.up == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success' && github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/wsl-install
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        timeout-minutes: 10
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          # Already registered by ./.github/actions/wsl-install. See
          # wsl-install.ps1 for #43, #96, and #134. This step must not run
          # `wsl --install` or apt-get. A stuck wsl.exe keeps stdio open, so
          # timeout-minutes does not reap it.
          use-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache/wsl-julia
          # ci's depot, compiled files included. SSH E2E uses wsl-julia-up.
          key: wsl-julia-1.13-up-${{ hashFiles('lib/DistSSHUp/Project.toml', 'lib/DistSSHUp/test/Project.toml', '.github/julia-slots.env') }}
      - name: Pkg.test in WSL2
        shell: wsl-bash {0}
        run: ./.github/wsl-julia.sh 1.13 julia --project=lib/DistSSHUp -e 'using Pkg; Pkg.test()'

  up-ssh-e2e:
    name: DistSSHUp (ubuntu-latest → ubuntu-26.04)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.e2e == 'true' && needs.detect.outputs.up == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # buildx type=gha cache for the worker image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        id: julia
        with:
          version: "1.13"
      - name: Julia ${{ steps.julia.outputs.version }}
        run: julia --version
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
        with:
          project: lib/DistSSHUp
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: docker-ssh up + SSH E2E
        env:
          DISTSSHKIT_BUILD_CACHE: gha
          DISTSSHKIT_SSH_E2E: "1"
        run: |
          ./testenv/docker-ssh/scripts/up.sh
          julia --project=lib/DistSSHUp lib/DistSSHUp/test/e2e.jl
      - name: Teardown workers
        if: ${{ always() }}
        run: ./testenv/docker-ssh/scripts/down.sh || true


  base-test-ubuntu:
    name: DistSSHBase (1.13, ubuntu-latest, x64)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.detect.outputs.base == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Codecov OIDC on main push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Pkg.test
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            julia --project=lib/DistSSHBase -e 'using Pkg; Pkg.test(; coverage=true)'
          else
            julia --project=lib/DistSSHBase -e 'using Pkg; Pkg.test()'
          fi
      - uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38 # v1.2.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          directories: lib/DistSSHBase/src
      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          slug: ${{ github.repository }}
          use_oidc: true
          flags: pkgtest
          fail_ci_if_error: true

  base-test-macos:
    name: DistSSHBase (1.13, macos-latest, aarch64)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.detect.outputs.base == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success' && success()
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Pkg.test
        run: julia --project=lib/DistSSHBase -e 'using Pkg; Pkg.test()'

  base-test-wsl:
    name: DistSSHBase (1.13, WSL2 ubuntu-24.04, x64)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.detect.outputs.base == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success' && github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/wsl-install
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        timeout-minutes: 10
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          # Already registered by ./.github/actions/wsl-install. See
          # wsl-install.ps1 for #43, #96, and #134. This step must not run
          # `wsl --install` or apt-get. A stuck wsl.exe keeps stdio open, so
          # timeout-minutes does not reap it.
          use-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache/wsl-julia
          # ci's depot, compiled files included. SSH E2E uses wsl-julia-base.
          key: wsl-julia-1.13-base-${{ hashFiles('lib/DistSSHBase/Project.toml', 'lib/DistSSHBase/test/Project.toml', '.github/julia-slots.env') }}
      - name: Pkg.test in WSL2
        shell: wsl-bash {0}
        run: ./.github/wsl-julia.sh 1.13 julia --project=lib/DistSSHBase -e 'using Pkg; Pkg.test()'

  base-ssh-e2e:
    name: DistSSHBase (ubuntu-latest → ubuntu-26.04)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.e2e == 'true' && needs.detect.outputs.base == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # buildx type=gha cache for the worker image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        id: julia
        with:
          version: "1.13"
      - name: Julia ${{ steps.julia.outputs.version }}
        run: julia --version
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
        with:
          project: lib/DistSSHBase
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: docker-ssh up + SSH E2E
        env:
          DISTSSHKIT_BUILD_CACHE: gha
          DISTSSHKIT_SSH_E2E: "1"
        run: |
          ./testenv/docker-ssh/scripts/up.sh
          julia --project=lib/DistSSHBase lib/DistSSHBase/test/e2e.jl
      - name: Teardown workers
        if: ${{ always() }}
        run: ./testenv/docker-ssh/scripts/down.sh || true


  # A skipped job does not expand a matrix name, so these titles stay literal.
  # Version string is ~1.14.0-0. The title is 1.14-pre, shared with Queue and Kit.
  # Required: a driver blocked in pmap must cancel within interrupt_grace + 11s
  # (#212). The macOS job is that suite on macos-latest. It waits for the
  # same Runic / JETLS 1.13 / Aqua 1.13 gate as Run 1.13, then runs beside
  # that chain. Nightly stays continue-on-error.
  # Aqua, JETLS, and Linux E2E on 1.14-pre stay continue-on-error.
  test-1-14-pre:
    name: DistSSHRun (1.14-pre, ubuntu-latest, x64)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "~1.14.0-0"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test

  test-1-14-pre-macos:
    name: DistSSHRun (1.14-pre, macos-latest, aarch64)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "~1.14.0-0"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test

  test-nightly:
    name: DistSSHRun (nightly, ubuntu-latest, x64)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success' && (github.event_name != 'pull_request' || needs.detect.outputs.version_cut == 'true')
    runs-on: ubuntu-latest
    # Cold nightly precompile plus the full suite does not fit in 20 minutes.
    # The same suite on 1.13 does.
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "nightly"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test

  # The commit under test, installed the way General installs it:
  # packages/<name>/<slug>, read-only files, no gitignored Manifest.
  # Pull requests checkout head.sha, not the merge ref. Not continue-on-error.
  # Add the job name to the main ruleset; this file does not change it.
  registry-install:
    name: Registry install (1.13, ubuntu-latest, x64)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # pull_request's github.sha is the merge commit. Install the head.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: ./.github/actions/registry-install
        with:
          package: DistSSHRun
          rev: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  # Not required to merge. This checkout inside PkgEval's sandbox, against
  # Julia nightly. Host Julia is 1.13. Dependencies come from General.
  pkgeval:
    name: PkgEval (nightly, ubuntu-latest, x64)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkgeval
        with:
          package: DistSSHRun

  # Same check as the monthly workflow. That file no longer runs on a PR,
  # so this job is the one heavy jobs wait for. Not a ruleset name. A red
  # result skips Pkg.test, so the required checks stay skipping.
  runic:
    name: Runic
    needs: detect
    if: needs.detect.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.13"
      - uses: fredrikekre/runic-action@b4dbd650db5cc684baae27fea45d22daf41693c2 # v1.5.0
        with:
          version: '1'

  aqua:
    name: Aqua (1.13, ubuntu-latest, x64)
    needs: detect
    if: needs.detect.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Aqua.test_all (latest Aqua)
        run: ./.github/aqua-check.sh

  aqua-1-14-pre:
    name: Aqua (1.14-pre, ubuntu-latest, x64)
    needs: detect
    if: needs.detect.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "~1.14.0-0"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Aqua.test_all (latest Aqua)
        run: ./.github/aqua-check.sh

  aqua-nightly:
    name: Aqua (nightly, ubuntu-latest, x64)
    needs: detect
    if: needs.detect.outputs.heavy == 'true' && (github.event_name != 'pull_request' || needs.detect.outputs.version_cut == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "nightly"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Aqua.test_all (latest Aqua)
        run: ./.github/aqua-check.sh

  # Literal name: a skipped job must still be this string.
  # Required check. JETLS 2026-10-26 supports Julia 1.12.2 through 1.14.
  jetls:
    name: JETLS (1.13, ubuntu-latest, x64)
    needs: detect
    if: needs.detect.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: files
        run: echo "list=$(./.github/jetls-check.sh --print-files)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/jetls-check
        with:
          files: ${{ steps.files.outputs.list }}

  # Same action and file list as the 1.13 job. continue-on-error, so a new
  # hint does not block merge. Not a ruleset check. The 1.13 name stays.
  # Version string is ~1.14.0-0. The title is 1.14-pre.
  jetls-1-14-pre:
    name: JETLS (1.14-pre, ubuntu-latest, x64)
    needs: detect
    if: needs.detect.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: files
        run: echo "list=$(./.github/jetls-check.sh --print-files)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/julia-slot
        with:
          version: "~1.14.0-0"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/jetls-check
        with:
          files: ${{ steps.files.outputs.list }}

  ssh-e2e:
    name: DistSSHRun (1.13, ubuntu-latest → ubuntu-26.04)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.e2e == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # buildx type=gha cache for the worker image
      id-token: write # Codecov OIDC when a version-cut PR runs E2E coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        id: julia
        with:
          version: "1.13"
      - name: Julia ${{ steps.julia.outputs.version }}
        run: julia --version

      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false

      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: docker-ssh up + SSH E2E
        id: e2e
        env:
          DISTSSHKIT_CODE_COVERAGE: ${{ needs.detect.outputs.coverage == 'true' && '1' || '' }}
          DISTSSHKIT_BUILD_CACHE: gha
        run: ./testenv/docker-ssh/scripts/up.sh --e2e

      - uses: ./.github/actions/e2e-codecov
        if: ${{ always() && steps.e2e.outcome == 'success' && needs.detect.outputs.coverage == 'true' }}

      - name: Teardown workers
        if: ${{ always() }}
        run: ./testenv/docker-ssh/scripts/down.sh || true

  # Same path gate as 1.13. Parent and workers are 1.14 (JULIA_DEFAULT_CHANNEL).
  # Alt stays JULIA_E2E_MISMATCH_CHANNEL (1.12). continue-on-error; not a ruleset check.
  ssh-e2e-1-14-pre:
    name: DistSSHRun (1.14-pre, ubuntu-latest → ubuntu-26.04)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.e2e == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
      actions: write # buildx type=gha cache for the worker image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        id: julia
        with:
          version: "~1.14.0-0"
      - name: Julia ${{ steps.julia.outputs.version }}
        run: julia --version

      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false

      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: docker-ssh up + SSH E2E
        env:
          DISTSSHKIT_BUILD_CACHE: gha
          JULIA_DEFAULT_CHANNEL: "1.14"
        run: ./testenv/docker-ssh/scripts/up.sh --e2e

      - name: Teardown workers
        if: ${{ always() }}
        run: ./testenv/docker-ssh/scripts/down.sh || true

  # Queue host loads this checkout (DISTSSHQUEUE_DEV_RUN). Workers stay on
  # General DistSSHRun inside the published Queue image. No buildx.
  queue-ssh-e2e:
    name: Downstream SSH E2E (DistSSHQueue, 1.13)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.queue_e2e == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yamanori99/DistSSHQueue.jl
          ref: main
          path: downstream
          persist-credentials: false
      - name: docker-ssh up + SSH E2E
        working-directory: downstream
        env:
          DISTSSHQUEUE_DEV_RUN: ${{ github.workspace }}
          DISTSSHQUEUE_WORKER_IMAGE: ghcr.io/yamanori99/distsshqueue-linux-ssh-worker:latest
          DISTSSHQUEUE_WORKER_PULL_RETRIES: "8"
        run: ./testenv/docker-ssh/scripts/up.sh --e2e
      - name: Teardown workers
        if: always()
        run: |
          if [[ -d downstream ]]; then
            (cd downstream && ./testenv/docker-ssh/scripts/down.sh) || true
          fi

