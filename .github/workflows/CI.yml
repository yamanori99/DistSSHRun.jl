      - name: docker-ssh up + SSH E2E
        env:
          DISTSSH_BUILD_CACHE: gha
          DISTSSH_SSH_E2E: "1"
        run: |
          ./testenv/docker-ssh/scripts/up.sh
          julia --project=lib/DistSSHShip lib/DistSSHShip/test/e2e.jl
      - name: Teardown workers
        if: ${{ always() }}
        run: ./testenv/docker-ssh/scripts/down.sh || true

  heartbeat-ssh-e2e:
    name: DistSSHHeartbeat (ubuntu-latest → ubuntu-26.04)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.e2e == 'true' && (needs.detect.outputs.heartbeat == 'true' || needs.detect.outputs.testenv == 'true') && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # buildx type=gha cache for the worker image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        id: julia
        with:
          version: "1.13"
      - name: Julia ${{ steps.julia.outputs.version }}
        run: julia --version
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
        with:
          project: lib/DistSSHHeartbeat
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.4.0
      - name: docker-ssh up + SSH E2E
        env:
          DISTSSH_BUILD_CACHE: gha
          DISTSSH_SSH_E2E: "1"
          # Standing soak: 3 SIGSTOP iterations per run (test default is 1; raise for a manual soak).
          DISTSSH_HEARTBEAT_E2E_N: "3"
        run: |
          ./testenv/docker-ssh/scripts/up.sh
          julia --project=lib/DistSSHHeartbeat lib/DistSSHHeartbeat/test/e2e.jl
      - name: Teardown workers
        if: ${{ always() }}
        run: ./testenv/docker-ssh/scripts/down.sh || true

  # Version string is ~1.14.0-0. The title is 1.14-pre, shared with Queue and Kit.
  # Required: a driver blocked in pmap must cancel within interrupt_grace + 11s
  # (#212). The macOS job is that suite on xcode-27. It waits for the
  # same Runic / JETLS 1.13 / Aqua 1.13 gate as Run 1.13, then runs beside
  # that chain. Nightly stays continue-on-error.
  # Aqua, JETLS, and Linux E2E on 1.14-pre stay continue-on-error.
  test-1-14-pre-unit:
    name: DistSSHRun (1.14-pre, ubuntu-latest, x64, unit)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    env:
      DISTSSH_TEST_GROUP: unit
    runs-on: ubuntu-latest
    # 1.14-pre precompile plus the suite crossed 20 minutes after the tests
    # had already passed. Ubuntu 1.13 uses 60.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "~1.14.0-0"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test

  test-1-14-pre-integration:
    name: DistSSHRun (1.14-pre, ubuntu-latest, x64, integration)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    env:
      DISTSSH_TEST_GROUP: integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "~1.14.0-0"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test

  test-1-14-pre-macos-unit:
    name: DistSSHRun (1.14-pre, xcode-27, aarch64, unit)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    env:
      DISTSSH_TEST_GROUP: unit
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "~1.14.0-0"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test

  test-1-14-pre-macos-integration:
    name: DistSSHRun (1.14-pre, xcode-27, aarch64, integration)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    env:
      DISTSSH_TEST_GROUP: integration
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "~1.14.0-0"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test

  test-nightly:
    name: DistSSHRun (nightly, ubuntu-latest, x64)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Cold nightly precompile plus the full suite needs more than the 1.13 gate.
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "nightly"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test

  # The commit under test, installed the way General installs it:
  # packages/<name>/<slug>, read-only files, no gitignored Manifest.
  # Pull requests checkout head.sha, not the merge ref. Not continue-on-error.
  # Add the job name to the main ruleset; this file does not change it.
  registry-install:
    name: Registry install (1.13, ubuntu-latest, x64)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # pull_request's github.sha is the merge commit. Install the head.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: ./.github/actions/registry-install
        with:
          package: DistSSHRun
          rev: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  # Not required to merge. This checkout inside PkgEval's sandbox, against
  # Julia nightly. Host Julia is 1.13. Dependencies come from General.
  pkgeval:
    name: PkgEval (nightly, ubuntu-latest, x64)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkgeval
        with:
          package: DistSSHRun

  # Same check as the monthly workflow. That file no longer runs on a PR,
  # so this job is the one heavy jobs wait for. Not a ruleset name. A red
  # result skips Pkg.test, so the required checks stay skipping.
  runic:
    name: Runic
    needs: detect
    if: needs.detect.outputs.precheck == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.13"
      - name: Runic pin
        id: runic-pin
        shell: bash
        run: |
          set -euo pipefail
          v="$(sed -n -E 's/^Runic = "=([^"]+)".*/\1/p' .github/runic/Project.toml | head -1)"
          if [[ ! "${v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo ".github/runic/Project.toml: Runic compat pin missing or invalid" >&2
            exit 1
          fi
          echo "version=${v}" >> "${GITHUB_OUTPUT}"
      - uses: fredrikekre/runic-action@b4dbd650db5cc684baae27fea45d22daf41693c2 # v1.5.0
        with:
          version: ${{ steps.runic-pin.outputs.version }}

  diff-lint-self-test:
    name: diff-lint self-test
    needs: detect
    if: needs.detect.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: diff_lint.jl self-test
        run: |
          set -euo pipefail
          julia --project=.github/runic --startup-file=no -e 'using Pkg; Pkg.instantiate()'
          julia --project=.github/runic --startup-file=no scripts/lint/diff_lint.jl self-test

  aqua:
    name: Aqua (1.13, ubuntu-latest, x64)
    needs: detect
    if: needs.detect.outputs.precheck == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Aqua.test_all (latest Aqua)
        run: ./.github/aqua-check.sh

  aqua-1-14-pre:
    name: Aqua (1.14-pre, ubuntu-latest, x64)
    needs: detect
    if: needs.detect.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "~1.14.0-0"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Aqua.test_all (latest Aqua)
        run: ./.github/aqua-check.sh

  aqua-nightly:
    name: Aqua (nightly, ubuntu-latest, x64)
    needs: detect
    if: needs.detect.outputs.heavy == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "nightly"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Aqua.test_all (latest Aqua)
        run: ./.github/aqua-check.sh

  # Literal name: a skipped job must still be this string.
  # Required check. JETLS 2026-11-20 supports Julia 1.12.2 through 1.14.
  jetls:
    name: JETLS (1.13, ubuntu-latest, x64)
    needs: detect
    if: needs.detect.outputs.precheck == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Official x86_64 release target from JuliaCI/julia-buildkite
    # utilities/build_envs.sh (generic, sandybridge, haswell, x86-64-v4).
    # Pkgimages then load on any GitHub-hosted x86_64 runner. Job env only.
    env:
      JULIA_CPU_TARGET: "generic;sandybridge,-xsaveopt,clone_all;haswell,-rdrnd,base(1);x86-64-v4,-rdrnd,base(1)"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: files
        run: echo "list=$(./.github/jetls-check.sh --print-files)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - name: Log runner CPU
        id: runner
        run: |
          set -euo pipefail
          julia --startup-file=no -e 'println("CPU_NAME=", Sys.CPU_NAME); println("CPU_MODEL=", Sys.cpu_info()[1].model)'
          # Resolved VERSION, not the slot request (~1.14.0-0 stays put across alphas).
          ver="$(julia --startup-file=no -e 'print(VERSION)')"
          # First 12 hex digits of sha256(JULIA_CPU_TARGET). No newline in the input.
          tag="$(printf '%s' "$JULIA_CPU_TARGET" | sha256sum | cut -c1-12)"
          echo "julia=${ver}" >> "$GITHUB_OUTPUT"
          echo "cputarget=${tag}" >> "$GITHUB_OUTPUT"
          echo "jetls-cache: julia=${ver} cputarget=${tag}"
      # Default prefix omits the target and the resolved version, so the
      # native 1.13 depot stays the newest restore. Old caches are left in place.
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};cputarget=${{ steps.runner.outputs.cputarget }};julia=${{ steps.runner.outputs.julia }}
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/jetls-check
        with:
          files: ${{ steps.files.outputs.list }}

  # Same action and file list as the 1.13 job. continue-on-error, so a new
  # hint does not block merge. Not a ruleset check. The 1.13 name stays.
  # Version string is ~1.14.0-0. The title is 1.14-pre.
  jetls-1-14-pre:
    name: JETLS (1.14-pre, ubuntu-latest, x64)
    needs: detect
    if: needs.detect.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    # Same multi-target as the 1.13 job. See that job's env comment.
    env:
      JULIA_CPU_TARGET: "generic;sandybridge,-xsaveopt,clone_all;haswell,-rdrnd,base(1);x86-64-v4,-rdrnd,base(1)"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: files
        run: echo "list=$(./.github/jetls-check.sh --print-files)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/julia-slot
        with:
          version: "~1.14.0-0"
      - name: Log runner CPU
        id: runner
        run: |
          set -euo pipefail
          julia --startup-file=no -e 'println("CPU_NAME=", Sys.CPU_NAME); println("CPU_MODEL=", Sys.cpu_info()[1].model)'
          # Resolved VERSION, not the slot request (~1.14.0-0 stays put across alphas).
          ver="$(julia --startup-file=no -e 'print(VERSION)')"
          # First 12 hex digits of sha256(JULIA_CPU_TARGET). No newline in the input.
          tag="$(printf '%s' "$JULIA_CPU_TARGET" | sha256sum | cut -c1-12)"
          echo "julia=${ver}" >> "$GITHUB_OUTPUT"
          echo "cputarget=${tag}" >> "$GITHUB_OUTPUT"
          echo "jetls-cache: julia=${ver} cputarget=${tag}"
      # Same prefix fields as the 1.13 job. An alpha bump changes julia=.
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};cputarget=${{ steps.runner.outputs.cputarget }};julia=${{ steps.runner.outputs.julia }}
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/jetls-check
        with:
          files: ${{ steps.files.outputs.list }}

  ssh-e2e:
    name: DistSSHRun (1.13, ubuntu-latest → ubuntu-26.04)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.e2e == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    runs-on: ubuntu-latest
    # Full SSH E2E: main successes reach ~30 min; the last testset needs ~2 min more.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write # buildx type=gha cache for the worker image
      id-token: write # Codecov OIDC on main push, version-cut PR, and weekly E2E coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        id: julia
        with:
          version: "1.13"
      - name: Julia ${{ steps.julia.outputs.version }}
        run: julia --version

      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false

      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - uses: ./.github/actions/docker-ssh-dns-diag

      - name: docker-ssh up + SSH E2E
        id: e2e
        env:
          DISTSSH_CODE_COVERAGE: ${{ needs.detect.outputs.coverage == 'true' && '1' || '' }}
          DISTSSH_BUILD_CACHE: gha
        run: ./testenv/docker-ssh/scripts/up.sh --e2e

      - uses: ./.github/actions/e2e-codecov
        if: ${{ always() && steps.e2e.outcome == 'success' && needs.detect.outputs.coverage == 'true' }}

      - name: Teardown workers
        if: ${{ always() }}
        run: ./testenv/docker-ssh/scripts/down.sh || true

  # Same path gate as 1.13. Parent and workers are 1.14 (JULIA_DEFAULT_CHANNEL).
  # Alt stays JULIA_E2E_MISMATCH_CHANNEL (1.12). continue-on-error; not a ruleset check.
  ssh-e2e-1-14-pre:
    name: DistSSHRun (1.14-pre, ubuntu-latest → ubuntu-26.04)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.e2e == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: read
      actions: write # buildx type=gha cache for the worker image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        id: julia
        with:
          version: "~1.14.0-0"
      - name: Julia ${{ steps.julia.outputs.version }}
        run: julia --version

      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false

      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - uses: ./.github/actions/docker-ssh-dns-diag

      - name: docker-ssh up + SSH E2E
        env:
          DISTSSH_BUILD_CACHE: gha
          JULIA_DEFAULT_CHANNEL: "1.14"
        run: ./testenv/docker-ssh/scripts/up.sh --e2e

      - name: Teardown workers
        if: ${{ always() }}
        run: ./testenv/docker-ssh/scripts/down.sh || true

  # Queue host loads this checkout (DISTSSHQUEUE_DEV_RUN). Workers stay on
  # General DistSSHRun inside the published Queue image. No buildx.
  queue-ssh-e2e:
    name: Downstream SSH E2E (DistSSHQueue, 1.13)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.queue_e2e == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      # Outside the Run git worktree so Queue's DISTSSHQUEUE_DEV_RUN porcelain check stays clean.
      - name: Check out DistSSHQueue
        env:
          DISTSSHQUEUE_CHECKOUT: ${{ runner.temp }}/DistSSHQueue
        run: |
          rm -rf "$DISTSSHQUEUE_CHECKOUT"
          git clone --depth 1 --branch main \
            https://github.com/yamanori99/DistSSHQueue.jl.git \
            "$DISTSSHQUEUE_CHECKOUT"
      - name: docker-ssh up + SSH E2E
        working-directory: ${{ runner.temp }}/DistSSHQueue
        env:
          DISTSSHQUEUE_DEV_RUN: ${{ github.workspace }}
          DISTSSHQUEUE_WORKER_IMAGE: ghcr.io/yamanori99/distsshqueue-linux-ssh-worker:latest
          DISTSSHQUEUE_WORKER_PULL_RETRIES: "8"
        run: ./testenv/docker-ssh/scripts/up.sh --e2e
      - name: Teardown workers
        if: always()
        env:
          DISTSSHQUEUE_CHECKOUT: ${{ runner.temp }}/DistSSHQueue
        run: |
          if [[ -d "$DISTSSHQUEUE_CHECKOUT" ]]; then
            (cd "$DISTSSHQUEUE_CHECKOUT" && ./testenv/docker-ssh/scripts/down.sh) || true
          fi

  # Always runs. Later: sole ruleset required check (replaces per-job edits).
  gate:
    name: gate
    needs:
      - detect
      - runic
      - diff-lint-self-test
      - jetls
      - aqua
      - aqua-1-14-pre
      - aqua-nightly
      - jetls-1-14-pre
      - test-unit
      - test-integration
      - test-coverage
      - test-macos-unit
      - test-macos-integration
      - test-wsl
      - test-1-14-pre-unit
      - test-1-14-pre-integration
      - test-1-14-pre-macos-unit
      - test-1-14-pre-macos-integration
      - test-nightly
      - registry-install
      - pkgeval
      - downstream
      - base-test-ubuntu
      - base-test-macos
      - base-test-wsl
      - up-test-ubuntu
      - up-test-macos
      - up-test-wsl
      - ship-test-ubuntu
      - ship-test-macos
      - ship-test-wsl
      - heartbeat-test-ubuntu
      - heartbeat-test-macos
      - heartbeat-test-wsl
      - up-ssh-e2e
      - base-ssh-e2e
      - ship-ssh-e2e
      - heartbeat-ssh-e2e
      - ssh-e2e
      - ssh-e2e-1-14-pre
      - queue-ssh-e2e
    if: ${{ !cancelled() && always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Runic pin
        id: runic-pin
        shell: bash
        run: |
          set -euo pipefail
          v="$(sed -n -E 's/^Runic = "=([^"]+)".*/\1/p' .github/runic/Project.toml | head -1)"
          if [[ ! "${v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo ".github/runic/Project.toml: Runic compat pin missing or invalid" >&2
            exit 1
          fi
          echo "version=${v}" >> "${GITHUB_OUTPUT}"
      - name: Install pinned Runic app
        id: runic-app
        run: |
          set -euo pipefail
          julia --startup-file=no -e '
            using Pkg
            v = ENV["RUNIC_PIN"]
            Pkg.Apps.add(PackageSpec(
              name = "Runic",
              uuid = Base.UUID("62bfec6d-59d7-401d-8490-b29ee721c001"),
              version = VersionNumber(v),
            ))
          '
          bin="$(julia --startup-file=no -e 'print(joinpath(DEPOT_PATH[1], "bin", "runic"))')"
          [[ -x "${bin}" ]] || { echo "gate: Runic app missing (${bin})" >&2; exit 1; }
          echo "bin=${bin}" >> "${GITHUB_OUTPUT}"
        env:
          RUNIC_PIN: ${{ steps.runic-pin.outputs.version }}
      - name: Diff base for PR
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zeros="$(printf '0%.0s' {1..40})"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            base="${PR_BASE}"
            head="${SHA}"
          elif [ -n "${BEFORE}" ] && [ "${BEFORE}" != "${zeros}" ]; then
            base="${BEFORE}"
            head="${SHA}"
          else
            base="$(git rev-parse origin/main)"
            head="${SHA}"
          fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "head=${head}" >> "$GITHUB_OUTPUT"
      - name: PR body for lint
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GATE_DIFF_BASE: ${{ steps.diff.outputs.base }}
          GATE_DIFF_HEAD: ${{ steps.diff.outputs.head }}
        run: |
          set -euo pipefail
          gh pr view "${PR_NUMBER}" --json body --jq .body > "${RUNNER_TEMP}/gate-pr-body.txt"
          git diff --name-only "${GATE_DIFF_BASE}...${GATE_DIFF_HEAD}" > "${RUNNER_TEMP}/gate-pr-paths.txt"
      - name: Cheap mechanical guards
        env:
          GATE_DIFF_BASE: ${{ steps.diff.outputs.base }}
          GATE_DIFF_HEAD: ${{ steps.diff.outputs.head }}
          GATE_NEWLINE_ALL: "1"
          GATE_ISSUE_CHECK: "1"
          GITHUB_ACTIONS: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          GATE_PR_BODY_FILE: ${{ github.event_name == 'pull_request' && format('{0}/gate-pr-body.txt', runner.temp) || '' }}
          GATE_PR_PATHS_FILE: ${{ github.event_name == 'pull_request' && format('{0}/gate-pr-paths.txt', runner.temp) || '' }}
          GATE_RUNIC_BIN: ${{ steps.runic-app.outputs.bin }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: ./scripts/gate/cheap.sh
      - name: Judge required jobs
        env:
          DETECT_HEAVY: ${{ needs.detect.outputs.heavy }}
          DETECT_SCRIPTS: ${{ needs.detect.outputs.scripts }}
          DETECT_E2E: ${{ needs.detect.outputs.e2e }}
          DETECT_BASE: ${{ needs.detect.outputs.base }}
          DETECT_UP: ${{ needs.detect.outputs.up }}
          DETECT_SHIP: ${{ needs.detect.outputs.ship }}
          DETECT_HEARTBEAT: ${{ needs.detect.outputs.heartbeat }}
          DETECT_QUEUE_E2E: ${{ needs.detect.outputs.queue_e2e }}
          DETECT_TESTENV: ${{ needs.detect.outputs.testenv }}
          DETECT_COVERAGE: ${{ needs.detect.outputs.coverage }}
          DETECT_DOWNSTREAM: ${{ needs.detect.outputs.downstream }}
          DETECT_PRECHECK: ${{ needs.detect.outputs.precheck }}
          DETECT_EVENT: ${{ github.event_name }}
          RESULT_detect: ${{ needs.detect.result }}
          RESULT_runic: ${{ needs.runic.result }}
          RESULT_diff_lint_self_test: ${{ needs.diff-lint-self-test.result }}
          RESULT_jetls: ${{ needs.jetls.result }}
          RESULT_aqua: ${{ needs.aqua.result }}
          RESULT_aqua_1_14_pre: ${{ needs.aqua-1-14-pre.result }}
          RESULT_aqua_nightly: ${{ needs.aqua-nightly.result }}
          RESULT_jetls_1_14_pre: ${{ needs.jetls-1-14-pre.result }}
          RESULT_test_unit: ${{ needs.test-unit.result }}
          RESULT_test_integration: ${{ needs.test-integration.result }}
          RESULT_test_coverage: ${{ needs.test-coverage.result }}
          RESULT_test_macos_unit: ${{ needs.test-macos-unit.result }}
          RESULT_test_macos_integration: ${{ needs.test-macos-integration.result }}
          RESULT_test_wsl: ${{ needs.test-wsl.result }}
          RESULT_test_1_14_pre_unit: ${{ needs.test-1-14-pre-unit.result }}
          RESULT_test_1_14_pre_integration: ${{ needs.test-1-14-pre-integration.result }}
          RESULT_test_1_14_pre_macos_unit: ${{ needs.test-1-14-pre-macos-unit.result }}
          RESULT_test_1_14_pre_macos_integration: ${{ needs.test-1-14-pre-macos-integration.result }}
          RESULT_test_nightly: ${{ needs.test-nightly.result }}
          RESULT_registry_install: ${{ needs.registry-install.result }}
          RESULT_pkgeval: ${{ needs.pkgeval.result }}
          RESULT_downstream: ${{ needs.downstream.result }}
          RESULT_base_test_ubuntu: ${{ needs.base-test-ubuntu.result }}
          RESULT_base_test_macos: ${{ needs.base-test-macos.result }}
          RESULT_base_test_wsl: ${{ needs.base-test-wsl.result }}
          RESULT_up_test_ubuntu: ${{ needs.up-test-ubuntu.result }}
          RESULT_up_test_macos: ${{ needs.up-test-macos.result }}
          RESULT_up_test_wsl: ${{ needs.up-test-wsl.result }}
          RESULT_ship_test_ubuntu: ${{ needs.ship-test-ubuntu.result }}
          RESULT_ship_test_macos: ${{ needs.ship-test-macos.result }}
          RESULT_ship_test_wsl: ${{ needs.ship-test-wsl.result }}
          RESULT_heartbeat_test_ubuntu: ${{ needs.heartbeat-test-ubuntu.result }}
          RESULT_heartbeat_test_macos: ${{ needs.heartbeat-test-macos.result }}
          RESULT_heartbeat_test_wsl: ${{ needs.heartbeat-test-wsl.result }}
          RESULT_up_ssh_e2e: ${{ needs.up-ssh-e2e.result }}
          RESULT_base_ssh_e2e: ${{ needs.base-ssh-e2e.result }}
          RESULT_ship_ssh_e2e: ${{ needs.ship-ssh-e2e.result }}
          RESULT_heartbeat_ssh_e2e: ${{ needs.heartbeat-ssh-e2e.result }}
          RESULT_ssh_e2e: ${{ needs.ssh-e2e.result }}
          RESULT_ssh_e2e_1_14_pre: ${{ needs.ssh-e2e-1-14-pre.result }}
          RESULT_queue_ssh_e2e: ${{ needs.queue-ssh-e2e.result }}
        run: ./scripts/gate/judge.sh
