name: Test

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
  workflow_dispatch:
  # Daily 06:00 JST (21:00 UTC). Downstream-only report; detect sets heavy=false.
  schedule:
    - cron: "0 21 * * *"

# Cancel redundant runs on the same branch/PR.
# Ubuntu 1.14-pre (setup-julia ~1.14.0-0) Pkg.test, Aqua, and JETLS follow
# the heavy gate, including ordinary pull requests. Linux SSH E2E 1.14-pre
# follows the E2E path filter (continue-on-error). A Project.toml version
# increase (see version-cut.sh) also runs Ubuntu nightly and Aqua on nightly.
# macOS 1.14-pre Pkg.test follows the heavy gate and is required. macOS
# nightly stays on CI weekly. WSL2 1.13 Pkg.test runs on a main
# push and CI weekly, not on a pull request.
# Ordinary pull requests skip DistSSHBase unless lib/DistSSHBase, root
# Project.toml, .github/julia-slots.env, this file, or .github/actions
# changed (`**/*.md` excluded). DistSSHUp also runs when lib/DistSSHUp
# changed. DistSSHShip also runs when lib/DistSSHShip changed.
# DistSSHHeartbeat also runs when lib/DistSSHHeartbeat changed. A main push,
# version-cut PR, and workflow_dispatch still run Base, Up, Ship, and Heartbeat in this
# workflow. Codecov stays a main push.
# Registry install follows the heavy gate, including ordinary pull requests.
# Downstream runs on a pull request with the `downstream` or `cut` label, on the
# daily schedule, and on workflow_dispatch. A main push skips it.
# PkgEval follows the heavy gate on push, workflow_dispatch, and version cuts;
# ordinary pull_request skips it. continue-on-error. No label is involved.
# A main push that changes only Project.toml and NEWS.md, and raises
# version, skips Test and does not start Linux E2E.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  # `Pkg.test` 1.13 on a pull request is ubuntu-latest and xcode-27.
  # WSL2 Ubuntu is a main push and CI weekly, not a pull request.
  # macOS is required. The macOS job exercises `ps -o lstart=`
  # in kit_process_start_key (no /proc). Coverage uploads from Ubuntu only.
  # Run's check titles are `DistSSHRun (...)`, the same shape as DistSSHBase,
  # DistSSHUp, DistSSHShip, and DistSSHHeartbeat. macOS 1.13 runs Base, then Up, then Ship, then
  # Heartbeat, then Run, one runner at a time. A skipped Base, Up, Ship, or Heartbeat does not skip the
  # next (`!cancelled()` and `!failure()`, and Run also needs Base so a Base
  # failure still blocks it).
  # WSL2 1.13 also runs Base, then Up, then Ship, then Heartbeat, then Run, one windows-latest
  # runner at a time within a single ordinary CI run. Ordering is
  # scheduling only (`!cancelled()`): a failed or skipped Base, Up, or Ship
  # does not skip the next eligible WSL job. Run still needs Base so a
  # skipped Up does not start Run while Base is still running. Static
  # gates stay result == success. This does not serialize across separate
  # workflow runs or repositories, and it raises total elapsed time when
  # the WSL jobs run.
  # Runic, JETLS 1.13, and Aqua 1.13 start after detect. Pkg.test, Registry,
  # PkgEval, downstream, and SSH E2E start only after those three succeed.
  # An `if` drops the implicit success() check, so each of those jobs names
  # needs.*.result == 'success'. 1.14-pre Aqua and JETLS stay
  # continue-on-error and do not hold the hosts. Ubuntu stays parallel once
  # the gate is green. Downstream is one
  # matrix (DistSSHQueue, DistSSHKit). Each required DistSSHBase, DistSSHUp,
  # DistSSHShip, and DistSSHHeartbeat title is its own job (Ubuntu, macOS, Ubuntu SSH
  # E2E for Base and Up). DistSSHRun unit and integration titles are also separate jobs
  # (Ubuntu and macOS, 1.13 and 1.14-pre). WSL2 titles run on a main push and CI weekly,
  # not a pull request.
  # A closed gate skips that job, so the check is skipping. Do not
  # put those titles in one matrix: a job-level if runs before the matrix
  # expands, and the required names never report.
  # Coverage uploads from the Ubuntu Run coverage job and the Ubuntu DistSSHBase,
  # DistSSHUp, DistSSHShip, and DistSSHHeartbeat jobs (per-package flags, main push).
  # Slow SSH E2E kit parents are `E2E weekly`
  # (macos-15-intel Colima, not this job).
  # PRs run `DistSSHRun (1.13, ubuntu-latest → ubuntu-26.04)` in this workflow.
  # `DistSSHRun (1.14-pre, ubuntu-latest → ubuntu-26.04)` is continue-on-error.
  # One detect job; markdown-only / allowlisted PRs skip heavy jobs (UI: skipping).
  # Required check names include the Julia version and the architecture.
  # Codecov (flags run/base/up/ship/heartbeat/e2e): main push Pkg.test; E2E on main + weekly + version-cut.
  # cache-scratchspaces: false — registry_updates.toml in scratchspaces can
  # poison Pkg.Registry.update on 1.13 if restored corrupt.
  # Aqua / JETLS / Runic share this workflow so the Test badge is the PR gate.
  # `.github/workflows/runic.yml` keeps the monthly schedule.
  # Linux E2E (1.13 required, 1.14-pre continue-on-error): path filter on PR /
  # main push; always on a version
  # increase and dispatch. JETLS uses `.github/actions/jetls-check` (no nested
  # cache; julia-actions/cache#236). JETLS 2026-11-20 supports 1.12.2 through
  # 1.14. The required job is 1.13. The 1.14-pre job is continue-on-error
  # and is not a required check.
  detect:
    name: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      heavy: ${{ steps.heavy.outputs.heavy }}
      scripts: ${{ steps.heavy.outputs.scripts }}
      version_cut: ${{ steps.heavy.outputs.version_cut }}
      e2e: ${{ steps.gate.outputs.e2e }}
      coverage: ${{ steps.gate.outputs.coverage }}
      # DistSSHBase / DistSSHUp path gates. True except on an ordinary pull request.
      base: ${{ steps.gate.outputs.base }}
      up: ${{ steps.gate.outputs.up }}
      ship: ${{ steps.gate.outputs.ship }}
      heartbeat: ${{ steps.gate.outputs.heartbeat }}
      # docker-ssh worker image / sshd only (lib SSH E2E, not Pkg.test).
      testenv: ${{ steps.gate.outputs.testenv }}
      # Queue's Linux SSH E2E against this checkout. Not the path-filtered `e2e` gate.
      queue_e2e: ${{ steps.gate.outputs.queue_e2e }}
      downstream: ${{ steps.gate.outputs.downstream }}
      precheck: ${{ steps.gate.outputs.precheck }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-heavy
        id: heavy
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            e2e:
              - "src/**"
              - "lib/**"
              - "test/**"
              - "!test/**/*.md"
              - "demos/**"
              - "!demos/**/*.md"
              - "testenv/**"
              - "!testenv/**/*.md"
              - "Project.toml"
              - ".github/julia-slots.env"
              - ".github/workflows/CI.yml"
            base:
              - "lib/DistSSHBase/**"
              - "!lib/DistSSHBase/**/*.md"
              - "Project.toml"
              - ".github/julia-slots.env"
              - ".github/workflows/CI.yml"
              - ".github/actions/**"
              - "!.github/actions/**/*.md"
            up:
              - "lib/DistSSHUp/**"
              - "!lib/DistSSHUp/**/*.md"
            ship:
              - "lib/DistSSHShip/**"
              - "!lib/DistSSHShip/**/*.md"
              - "testenv/**"
              - "!testenv/**/*.md"
            heartbeat:
              - "lib/DistSSHHeartbeat/**"
              - "!lib/DistSSHHeartbeat/**/*.md"
            testenv:
              - "testenv/**"
              - "!testenv/**/*.md"
      - id: pr-labels
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" \
            --jq '.[].name' > "${RUNNER_TEMP}/pr-labels.txt"
      - id: gate
        env:
          FILTER_E2E: ${{ steps.filter.outputs.e2e }}
          FILTER_BASE: ${{ steps.filter.outputs.base }}
          FILTER_UP: ${{ steps.filter.outputs.up }}
          FILTER_SHIP: ${{ steps.filter.outputs.ship }}
          FILTER_HEARTBEAT: ${{ steps.filter.outputs.heartbeat }}
          FILTER_TESTENV: ${{ steps.filter.outputs.testenv }}
          CUT: ${{ steps.heavy.outputs.version_cut }}
          HEAVY: ${{ steps.heavy.outputs.heavy }}
          SCRIPTS: ${{ steps.heavy.outputs.scripts }}
          PR_LABELS_FILE: ${{ github.event_name == 'pull_request' && format('{0}/pr-labels.txt', runner.temp) || '' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$HEAVY" = "false" ]; then
            echo "e2e=false" >> "$GITHUB_OUTPUT"
            echo "coverage=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$CUT" = "true" ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "e2e=${FILTER_E2E}" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ] && \
            { [ "$CUT" = "true" ] || [ "$HEAVY" != "false" ]; }; then
            echo "coverage=true" >> "$GITHUB_OUTPUT"
          else
            echo "coverage=false" >> "$GITHUB_OUTPUT"
          fi
          # Version-cut PRs, main pushes, and workflow_dispatch. Ordinary PRs stay false.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$CUT" = "true" ] || { [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; }; then
            echo "queue_e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "queue_e2e=false" >> "$GITHUB_OUTPUT"
          fi
          # Ordinary pull requests only. Push, dispatch, and a version cut run all three.
          # CI weekly is a separate workflow and does not read these outputs.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] || [ "$CUT" = "true" ]; then
            {
              echo "base=true"
              echo "up=true"
              echo "ship=true"
              echo "heartbeat=true"
              echo "testenv=true"
            } >> "$GITHUB_OUTPUT"
          else
            base="${FILTER_BASE:-false}"
            up_paths="${FILTER_UP:-false}"
            ship_paths="${FILTER_SHIP:-false}"
            heartbeat_paths="${FILTER_HEARTBEAT:-false}"
            echo "base=${base}" >> "$GITHUB_OUTPUT"
            if [ "$base" = "true" ] || [ "$up_paths" = "true" ]; then
              echo "up=true" >> "$GITHUB_OUTPUT"
            else
              echo "up=false" >> "$GITHUB_OUTPUT"
            fi
            if [ "$base" = "true" ] || [ "$ship_paths" = "true" ]; then
              echo "ship=true" >> "$GITHUB_OUTPUT"
            else
              echo "ship=false" >> "$GITHUB_OUTPUT"
            fi
            if [ "$base" = "true" ] || [ "$heartbeat_paths" = "true" ]; then
              echo "heartbeat=true" >> "$GITHUB_OUTPUT"
            else
              echo "heartbeat=false" >> "$GITHUB_OUTPUT"
            fi
            testenv_paths="${FILTER_TESTENV:-false}"
            echo "testenv=${testenv_paths}" >> "$GITHUB_OUTPUT"
          fi
          has_pr_label() {
            local want="$1"
            [ -n "${PR_LABELS_FILE:-}" ] && [ -f "${PR_LABELS_FILE}" ] || return 1
            grep -Fxq "${want}" "${PR_LABELS_FILE}"
          }
          downstream=false
          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch|schedule)
              downstream=true ;;
            pull_request)
              if has_pr_label downstream || has_pr_label cut || [ "${CUT}" = "true" ]; then
                downstream=true
              fi ;;
            push)
              downstream=false ;;
            *)
              downstream=true ;;
          esac
          echo "downstream=${downstream}" >> "$GITHUB_OUTPUT"
          precheck=false
          if [ "${HEAVY}" = "true" ] || [ "${SCRIPTS:-false}" = "true" ] || [ "${downstream}" = "true" ]; then
            precheck=true
          fi
          echo "precheck=${precheck}" >> "$GITHUB_OUTPUT"
  test-unit:
    name: DistSSHRun (1.13, ubuntu-latest, x64, unit)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    runs-on: ubuntu-latest
    env:
      DISTSSH_TEST_GROUP: unit
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test
        with:
          coverage: false
          upload: false

  test-integration:
    name: DistSSHRun (1.13, ubuntu-latest, x64, integration)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    runs-on: ubuntu-latest
    env:
      DISTSSH_TEST_GROUP: integration
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test
        with:
          coverage: false
          upload: false

  test-coverage:
    name: DistSSHRun (1.13, ubuntu-latest, x64, coverage)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # Codecov OIDC on main push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test
        with:
          coverage: true
          upload: true

  test-macos-unit:
    name: DistSSHRun (1.13, xcode-27, aarch64, unit)
    needs: [detect, runic, jetls, aqua, base-test-macos, up-test-macos, ship-test-macos, heartbeat-test-macos]
    # success() is false when a needed job is skipped, which would skip Run
    # after a path-gated Base or Up. Failure still blocks; skip does not.
    # The static gate is result == success, so a skipped Runic does not start Run.
    if: ${{ needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success' && !cancelled() && !failure() }}
    env:
      DISTSSH_TEST_GROUP: unit
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test

  test-macos-integration:
    name: DistSSHRun (1.13, xcode-27, aarch64, integration)
    needs: [detect, runic, jetls, aqua, base-test-macos, up-test-macos, ship-test-macos, heartbeat-test-macos]
    if: ${{ needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success' && !cancelled() && !failure() }}
    env:
      DISTSSH_TEST_GROUP: integration
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test

  test-wsl:
    name: DistSSHRun (1.13, WSL2 ubuntu-24.04, x64)
    needs: [detect, runic, jetls, aqua, base-test-wsl, up-test-wsl, ship-test-wsl, heartbeat-test-wsl]
    # Scheduling only after Base/Up/Ship WSL. A failed or skipped WSL peer must
    # not skip Run. Static gates stay result == success; cancel still skips.
    # Needs Base as well as Up and Ship so a skipped peer does not overlap.
    if: ${{ needs.detect.outputs.heavy == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success' && github.event_name != 'pull_request' && !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/wsl-install
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        timeout-minutes: 10
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          # Already registered by ./.github/actions/wsl-install. See
          # wsl-install.ps1 for #43, #96, and #134. This step must not run
          # `wsl --install` or apt-get. A stuck wsl.exe keeps stdio open, so
          # timeout-minutes does not reap it.
          use-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache/wsl-julia
          # ci's depot, compiled files included. SSH E2E uses wsl-julia.
          key: wsl-julia-1.13-${{ hashFiles('Project.toml', 'test/Project.toml', '.github/julia-slots.env') }}
      - name: Pkg.test in WSL2
        shell: wsl-bash {0}
        run: ./.github/wsl-julia.sh 1.13 julia --project=. -e 'using Pkg; Pkg.test()'

  downstream:
    name: Downstream (${{ matrix.pkg }}@main, 1.13)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.downstream == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pkg: [DistSSHQueue, DistSSHKit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: DistSSHRun.jl
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yamanori99/${{ matrix.pkg }}.jl
          ref: main
          path: downstream
          persist-credentials: false
      - name: Workspace .github for julia-slot
        run: ln -sfn DistSSHRun.jl/.github .github
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Public Run names in downstream src
        working-directory: DistSSHRun.jl
        env:
          DOWNSTREAM_SRC: ${{ github.workspace }}/downstream/src
        run: julia --startup-file=no --project=. .github/downstream_public.jl "$DOWNSTREAM_SRC"
      - name: Pkg.test downstream against this checkout
        env:
          PKG: ${{ matrix.pkg }}
          UPSTREAM: ${{ github.workspace }}/DistSSHRun.jl
          DOWNSTREAM: ${{ github.workspace }}/downstream
          UPSTREAM_PKG: DistSSHRun
        run: |
          julia --startup-file=no -e '
            using Pkg
            upstream = ENV["UPSTREAM"]
            downstream = ENV["DOWNSTREAM"]
            name = Symbol(ENV["UPSTREAM_PKG"])
            Pkg.activate(joinpath(downstream, "test"))
            Pkg.develop(PackageSpec(path = upstream))
            Pkg.instantiate()
            Core.eval(Main, Expr(:using, Expr(:., name)))
            dir = pkgdir(getfield(Main, name))
            dir === nothing && error(string(name, " has no pkgdir"))
            loaded = realpath(dir)
            expected = realpath(upstream)
            loaded == expected || error(string(name, " loaded from ", loaded))
            Pkg.activate(downstream)
            Pkg.develop(PackageSpec(path = upstream))
            Pkg.resolve()
            Pkg.test(ENV["PKG"])
          '

  ship-test-ubuntu:
    name: DistSSHShip (1.13, ubuntu-latest, x64)
    needs: [detect, runic, jetls, aqua]
    if: needs.detect.outputs.heavy == 'true' && needs.detect.outputs.ship == 'true' && needs.runic.result == 'success' && needs.jetls.result == 'success' && needs.aqua.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Codecov OIDC on main push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Pkg.test
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            julia --project=lib/DistSSHShip -e 'using Pkg; Pkg.test(; coverage=true)'
          else
            julia --project=lib/DistSSHShip -e 'using Pkg; Pkg.test()'
          fi
      - uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38 # v1.2.2
