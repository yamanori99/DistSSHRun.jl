name: CI weekly

# Not on pull_request: insurance for 1.13 / 1.14-nightly / Aqua / JETLS
# @release drift when no PR ran that day. PR / main push stay the gate.
# tip jobs are continue-on-error and omitted from notify.
# A 1.13 compile bench failure on main opens "Compile bench failed".
# 1.13 matches Test: Run's old titles, then downstream, DistSSHUp, and
# DistSSHBase as separate matrices (no coverage).
# 1.14-nightly Pkg.test and Aqua on macOS and WSL2 run here only, and stay
# out of notify. Ubuntu nightly also runs in Test.
on:
  workflow_dispatch:
  # Daily 06:00 JST (UTC 21:00). Misses E2E weekly (daily UTC 19:00).
  schedule:
    - cron: "0 21 * * *"

concurrency:
  group: ci-weekly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Pkg.test (1.13, ubuntu-latest, x64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test

  test-macos:
    name: Pkg.test (1.13, macos-latest, aarch64)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test

  test-wsl:
    name: Pkg.test (1.13, WSL2 ubuntu-24.04, x64)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        timeout-minutes: 10
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          # Cache the rootfs. Do not apt-get in this action: a stuck wsl.exe
          # keeps stdio open, so this step's timeout-minutes does not reap it.
          use-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache/wsl-julia
          key: wsl-julia-1.13-${{ hashFiles('Project.toml', 'test/Project.toml', '.github/julia-slots.env') }}
      - name: Pkg.test in WSL2
        shell: wsl-bash {0}
        run: ./.github/wsl-julia.sh 1.13 julia --project=. -e 'using Pkg; Pkg.test()'

  downstream:
    name: Downstream (${{ matrix.pkg }}, 1.13)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pkg: [DistSSHQueue, DistSSHKit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yamanori99/${{ matrix.pkg }}.jl
          ref: main
          path: downstream
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Pkg.test downstream against this checkout
        env:
          PKG: ${{ matrix.pkg }}
          UPSTREAM: ${{ github.workspace }}
          DOWNSTREAM: ${{ github.workspace }}/downstream
          UPSTREAM_PKG: DistSSHRun
        run: |
          julia --startup-file=no -e '
            using Pkg
            upstream = ENV["UPSTREAM"]
            downstream = ENV["DOWNSTREAM"]
            name = Symbol(ENV["UPSTREAM_PKG"])
            Pkg.activate(joinpath(downstream, "test"))
            Pkg.develop(PackageSpec(path = upstream))
            Pkg.instantiate()
            Core.eval(Main, Expr(:using, Expr(:., name)))
            dir = pkgdir(getfield(Main, name))
            dir === nothing && error(string(name, " has no pkgdir"))
            loaded = realpath(dir)
            expected = realpath(upstream)
            loaded == expected || error(string(name, " loaded from ", loaded))
            Pkg.activate(downstream)
            Pkg.test(ENV["PKG"])
          '


  up-test:
    name: DistSSHUp (1.13, ${{ matrix.slot.name }}, ${{ matrix.slot.arch }})
    runs-on: ${{ matrix.slot.runs }}
    timeout-minutes: ${{ matrix.slot.timeout }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        slot:
          - { runs: ubuntu-latest, name: ubuntu-latest, arch: x64, timeout: 20, wsl: false }
          - { runs: macos-latest, name: macos-latest, arch: aarch64, timeout: 30, wsl: false }
          - { runs: windows-latest, name: "WSL2 ubuntu-24.04", arch: x64, timeout: 45, wsl: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: ${{ !matrix.slot.wsl }}
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        if: matrix.slot.wsl
        timeout-minutes: 10
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          # Cache the rootfs. Do not apt-get in this action: a stuck wsl.exe
          # keeps stdio open, so this step's timeout-minutes does not reap it.
          use-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.slot.wsl
        with:
          path: .ci-cache/wsl-julia
          key: wsl-julia-1.13-up-${{ hashFiles('lib/DistSSHUp/Project.toml', 'lib/DistSSHUp/test/Project.toml', '.github/julia-slots.env') }}
      - name: Pkg.test in WSL2
        if: matrix.slot.wsl
        shell: wsl-bash {0}
        run: ./.github/wsl-julia.sh 1.13 julia --project=lib/DistSSHUp -e 'using Pkg; Pkg.test()'
      - uses: ./.github/actions/julia-slot
        if: ${{ !matrix.slot.wsl }}
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        if: ${{ !matrix.slot.wsl }}
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Pkg.test
        if: ${{ !matrix.slot.wsl }}
        run: julia --project=lib/DistSSHUp -e 'using Pkg; Pkg.test()'

  base-test:
    name: DistSSHBase (1.13, ${{ matrix.slot.name }}, ${{ matrix.slot.arch }})
    runs-on: ${{ matrix.slot.runs }}
    timeout-minutes: ${{ matrix.slot.timeout }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        slot:
          - { runs: ubuntu-latest, name: ubuntu-latest, arch: x64, timeout: 20, wsl: false }
          - { runs: macos-latest, name: macos-latest, arch: aarch64, timeout: 30, wsl: false }
          - { runs: windows-latest, name: "WSL2 ubuntu-24.04", arch: x64, timeout: 45, wsl: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: ${{ !matrix.slot.wsl }}
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        if: matrix.slot.wsl
        timeout-minutes: 10
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          # Cache the rootfs. Do not apt-get in this action: a stuck wsl.exe
          # keeps stdio open, so this step's timeout-minutes does not reap it.
          use-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.slot.wsl
        with:
          path: .ci-cache/wsl-julia
          key: wsl-julia-1.13-base-${{ hashFiles('lib/DistSSHBase/Project.toml', 'lib/DistSSHBase/test/Project.toml', '.github/julia-slots.env') }}
      - name: Pkg.test in WSL2
        if: matrix.slot.wsl
        shell: wsl-bash {0}
        run: ./.github/wsl-julia.sh 1.13 julia --project=lib/DistSSHBase -e 'using Pkg; Pkg.test()'
      - uses: ./.github/actions/julia-slot
        if: ${{ !matrix.slot.wsl }}
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        if: ${{ !matrix.slot.wsl }}
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Pkg.test
        if: ${{ !matrix.slot.wsl }}
        run: julia --project=lib/DistSSHBase -e 'using Pkg; Pkg.test()'

  test-tip:
    name: Pkg.test (1.14-nightly, ubuntu-latest, x64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.14-nightly"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test

  test-tip-macos:
    name: Pkg.test (1.14-nightly, macos-latest, aarch64)
    runs-on: macos-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.14-nightly"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test

  test-tip-wsl:
    name: Pkg.test (1.14-nightly, WSL2 ubuntu-24.04, x64)
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        timeout-minutes: 10
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          # Cache the rootfs. Do not apt-get in this action: a stuck wsl.exe
          # keeps stdio open, so this step's timeout-minutes does not reap it.
          use-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache/wsl-julia
          key: wsl-julia-1.14-nightly-${{ hashFiles('Project.toml', 'test/Project.toml', '.github/julia-slots.env') }}
      - name: Pkg.test in WSL2
        shell: wsl-bash {0}
        run: ./.github/wsl-julia.sh 1.14-nightly julia --project=. -e 'using Pkg; Pkg.test()'

  jetls:
    name: JETLS (1.13, ubuntu-latest, x64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: files
        run: echo "list=$(./.github/jetls-check.sh --print-files)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/jetls-check
        with:
          files: ${{ steps.files.outputs.list }}

  aqua:
    name: Aqua (1.13, ubuntu-latest, x64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Aqua.test_all (latest Aqua)
        run: ./.github/aqua-check.sh

  aqua-tip:
    name: Aqua (1.14-nightly, ubuntu-latest, x64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.14-nightly"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Aqua.test_all (latest Aqua)
        run: ./.github/aqua-check.sh

  aqua-tip-macos:
    name: Aqua (1.14-nightly, macos-latest, aarch64)
    runs-on: macos-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.14-nightly"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Aqua.test_all (latest Aqua)
        run: ./.github/aqua-check.sh

  aqua-tip-wsl:
    name: Aqua (1.14-nightly, WSL2 ubuntu-24.04, x64)
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        timeout-minutes: 10
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          # Cache the rootfs. Do not apt-get in this action: a stuck wsl.exe
          # keeps stdio open, so this step's timeout-minutes does not reap it.
          use-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache/wsl-julia
          key: wsl-julia-1.14-nightly-${{ hashFiles('Project.toml', 'test/Project.toml', '.github/julia-slots.env') }}
      - name: Aqua.test_all (latest Aqua)
        shell: wsl-bash {0}
        run: ./.github/wsl-julia.sh 1.14-nightly ./.github/aqua-check.sh

  compile-bench:
    name: Compile bench (1.13, ubuntu-latest, x64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1.13"
      - uses: ./.github/actions/compile-bench
        with:
          slot: "1.13"
          token: ${{ github.token }}

  compile-bench-nightly:
    name: Compile bench (1.14-nightly, ubuntu-latest, x64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1.14-nightly"
      - uses: ./.github/actions/compile-bench
        with:
          slot: "1.14-nightly"
          token: ${{ github.token }}

  notify-bench:
    needs: compile-bench
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: notify-bench
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open or close tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ needs.compile-bench.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/compile-bench-notify.sh

  cache-gc:
    needs:
      - test
      - test-macos
      - test-wsl
      - downstream
      - up-test
      - base-test
      - test-tip
      - test-tip-macos
      - test-tip-wsl
      - jetls
      - aqua
      - aqua-tip
      - aqua-tip-macos
      - aqua-tip-wsl
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: cache-gc
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep latest cache per ref and restore-key prefix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/cache-gc.sh

  notify:
    needs:
      - test
      - test-macos
      - test-wsl
      - downstream
      - up-test
      - base-test
      - jetls
      - aqua
      - cache-gc
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: notify
    permissions:
      issues: write
    steps:
      - name: Open or close tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED: ${{ contains(join(needs.*.result, ','), 'failure') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='CI weekly failed'
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label alert --search "in:title $title" --json number --jq '.[0].number // empty')"
          if [ "$FAILED" = "true" ]; then
            body="Latest run: $RUN_URL

          Not a PR check. Re-run **CI weekly** after a fix."
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label alert --body "$body"
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Latest run succeeded: $RUN_URL"
          fi
