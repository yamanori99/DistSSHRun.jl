name: CI weekly

# Not on pull_request: insurance for 1.13 / 1.14-pre / nightly / Aqua / JETLS
# @release drift when no PR ran that day. PR / main push stay the gate.
# 1.14-pre and nightly jobs are continue-on-error and omitted from notify.
# 1.13 matches a main push of Test: DistSSHRun titles, then
# DistSSHUp, DistSSHShip, DistSSHHeartbeat, and DistSSHBase as separate matrices (no coverage). WSL2
# 1.13 runs here and on a main push, not on a pull request.
# macOS nightly, and 1.14-pre and nightly Pkg.test and Aqua on WSL2, run here
# only, and stay out of notify. Ubuntu 1.14-pre and macOS 1.14-pre Pkg.test
# also run in Test. macOS Aqua stays here.
on:
  workflow_dispatch:
  # Daily 06:00 JST (UTC 21:00). Misses E2E weekly (daily UTC 19:00).
  schedule:
    - cron: "0 21 * * *"

concurrency:
  group: ci-weekly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: DistSSHRun (1.13, ubuntu-latest, x64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test

  test-macos:
    name: DistSSHRun (1.13, xcode-27, aarch64)
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test

  test-wsl:
    name: DistSSHRun (1.13, WSL2 ubuntu-24.04, x64)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/wsl-install
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        timeout-minutes: 10
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          # Already registered by ./.github/actions/wsl-install. See
          # wsl-install.ps1 for #43, #96, and #134. This step must not run
          # `wsl --install` or apt-get. A stuck wsl.exe keeps stdio open, so
          # timeout-minutes does not reap it.
          use-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache/wsl-julia
          # ci's depot, compiled files included. SSH E2E uses wsl-julia.
          key: wsl-julia-1.13-${{ hashFiles('Project.toml', 'test/Project.toml', '.github/julia-slots.env') }}
      - name: Pkg.test in WSL2
        shell: wsl-bash {0}
        run: ./.github/wsl-julia.sh 1.13 julia --project=. -e 'using Pkg; Pkg.test()'

  up-test:
    name: DistSSHUp (1.13, ${{ matrix.slot.name }}, ${{ matrix.slot.arch }})
    runs-on: ${{ matrix.slot.runs }}
    timeout-minutes: ${{ matrix.slot.timeout }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        slot:
          - { runs: ubuntu-latest, name: ubuntu-latest, arch: x64, timeout: 20, wsl: false }
          - { runs: xcode-27, name: xcode-27, arch: aarch64, timeout: 30, wsl: false }
          - { runs: windows-latest, name: "WSL2 ubuntu-24.04", arch: x64, timeout: 60, wsl: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/wsl-install
        if: matrix.slot.wsl
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        if: matrix.slot.wsl
        timeout-minutes: 10
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          # Already registered by ./.github/actions/wsl-install. See
          # wsl-install.ps1 for #43, #96, and #134. This step must not run
          # `wsl --install` or apt-get. A stuck wsl.exe keeps stdio open, so
          # timeout-minutes does not reap it.
          use-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.slot.wsl
        with:
          path: .ci-cache/wsl-julia
          # ci's depot, compiled files included. SSH E2E uses wsl-julia-up.
          key: wsl-julia-1.13-up-${{ hashFiles('lib/DistSSHUp/Project.toml', 'lib/DistSSHUp/test/Project.toml', '.github/julia-slots.env') }}
      - name: Pkg.test in WSL2
        if: matrix.slot.wsl
        shell: wsl-bash {0}
        run: ./.github/wsl-julia.sh 1.13 julia --project=lib/DistSSHUp -e 'using Pkg; Pkg.test()'
      - uses: ./.github/actions/julia-slot
        if: ${{ !matrix.slot.wsl }}
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        if: ${{ !matrix.slot.wsl }}
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Pkg.test
        if: ${{ !matrix.slot.wsl }}
        run: julia --project=lib/DistSSHUp -e 'using Pkg; Pkg.test()'

  ship-test:
    name: DistSSHShip (1.13, ${{ matrix.slot.name }}, ${{ matrix.slot.arch }})
    runs-on: ${{ matrix.slot.runs }}
    timeout-minutes: ${{ matrix.slot.timeout }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        slot:
          - { runs: ubuntu-latest, name: ubuntu-latest, arch: x64, timeout: 20, wsl: false }
          - { runs: xcode-27, name: xcode-27, arch: aarch64, timeout: 30, wsl: false }
          - { runs: windows-latest, name: "WSL2 ubuntu-24.04", arch: x64, timeout: 60, wsl: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/wsl-install
        if: matrix.slot.wsl
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        if: matrix.slot.wsl
        timeout-minutes: 10
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          # Already registered by ./.github/actions/wsl-install. See
          # wsl-install.ps1 for #43, #96, and #134. This step must not run
          # `wsl --install` or apt-get. A stuck wsl.exe keeps stdio open, so
          # timeout-minutes does not reap it.
          use-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.slot.wsl
        with:
          path: .ci-cache/wsl-julia
          key: wsl-julia-1.13-ship-${{ hashFiles('lib/DistSSHShip/Project.toml', 'lib/DistSSHShip/test/Project.toml', '.github/julia-slots.env') }}
      - name: Pkg.test in WSL2
        if: matrix.slot.wsl
        shell: wsl-bash {0}
        run: ./.github/wsl-julia.sh 1.13 julia --project=lib/DistSSHShip -e 'using Pkg; Pkg.test()'
      - uses: ./.github/actions/julia-slot
        if: ${{ !matrix.slot.wsl }}
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        if: ${{ !matrix.slot.wsl }}
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Pkg.test
        if: ${{ !matrix.slot.wsl }}
        run: julia --project=lib/DistSSHShip -e 'using Pkg; Pkg.test()'

  heartbeat-test:
    name: DistSSHHeartbeat (1.13, ${{ matrix.slot.name }}, ${{ matrix.slot.arch }})
    runs-on: ${{ matrix.slot.runs }}
    timeout-minutes: ${{ matrix.slot.timeout }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        slot:
          - { runs: ubuntu-latest, name: ubuntu-latest, arch: x64, timeout: 20, wsl: false }
          - { runs: xcode-27, name: xcode-27, arch: aarch64, timeout: 30, wsl: false }
          - { runs: windows-latest, name: "WSL2 ubuntu-24.04", arch: x64, timeout: 60, wsl: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/wsl-install
        if: matrix.slot.wsl
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        if: matrix.slot.wsl
        timeout-minutes: 10
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          use-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.slot.wsl
        with:
          path: .ci-cache/wsl-julia
          key: wsl-julia-1.13-heartbeat-${{ hashFiles('lib/DistSSHHeartbeat/Project.toml', 'lib/DistSSHHeartbeat/test/Project.toml', '.github/julia-slots.env') }}
      - name: Pkg.test in WSL2
        if: matrix.slot.wsl
        shell: wsl-bash {0}
        run: ./.github/wsl-julia.sh 1.13 julia --project=lib/DistSSHHeartbeat -e 'using Pkg; Pkg.test()'
      - uses: ./.github/actions/julia-slot
        if: ${{ !matrix.slot.wsl }}
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        if: ${{ !matrix.slot.wsl }}
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Pkg.test
        if: ${{ !matrix.slot.wsl }}
        run: julia --project=lib/DistSSHHeartbeat -e 'using Pkg; Pkg.test()'

  base-test:
    name: DistSSHBase (1.13, ${{ matrix.slot.name }}, ${{ matrix.slot.arch }})
    runs-on: ${{ matrix.slot.runs }}
    timeout-minutes: ${{ matrix.slot.timeout }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        slot:
          - { runs: ubuntu-latest, name: ubuntu-latest, arch: x64, timeout: 20, wsl: false }
          - { runs: xcode-27, name: xcode-27, arch: aarch64, timeout: 30, wsl: false }
          - { runs: windows-latest, name: "WSL2 ubuntu-24.04", arch: x64, timeout: 60, wsl: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/wsl-install
        if: matrix.slot.wsl
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        if: matrix.slot.wsl
        timeout-minutes: 10
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          # Already registered by ./.github/actions/wsl-install. See
          # wsl-install.ps1 for #43, #96, and #134. This step must not run
          # `wsl --install` or apt-get. A stuck wsl.exe keeps stdio open, so
          # timeout-minutes does not reap it.
          use-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.slot.wsl
        with:
          path: .ci-cache/wsl-julia
          # ci's depot, compiled files included. SSH E2E uses wsl-julia-base.
          key: wsl-julia-1.13-base-${{ hashFiles('lib/DistSSHBase/Project.toml', 'lib/DistSSHBase/test/Project.toml', '.github/julia-slots.env') }}
      - name: Pkg.test in WSL2
        if: matrix.slot.wsl
        shell: wsl-bash {0}
        run: ./.github/wsl-julia.sh 1.13 julia --project=lib/DistSSHBase -e 'using Pkg; Pkg.test()'
      - uses: ./.github/actions/julia-slot
        if: ${{ !matrix.slot.wsl }}
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        if: ${{ !matrix.slot.wsl }}
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Pkg.test
        if: ${{ !matrix.slot.wsl }}
        run: julia --project=lib/DistSSHBase -e 'using Pkg; Pkg.test()'

  test-1-14-pre:
    name: DistSSHRun (1.14-pre, ubuntu-latest, x64)
    runs-on: ubuntu-latest
    # Same suite as Test. 20 minutes cancelled a run after the tests passed.
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "~1.14.0-0"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test

  test-nightly:
    name: DistSSHRun (nightly, ubuntu-latest, x64)
    runs-on: ubuntu-latest
    # Same budget as CI.yml test-nightly.
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "nightly"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test

  test-1-14-pre-macos:
    name: DistSSHRun (1.14-pre, xcode-27, aarch64)
    runs-on: xcode-27
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "~1.14.0-0"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test

  test-nightly-macos:
    name: DistSSHRun (nightly, xcode-27, aarch64)
    runs-on: xcode-27
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "nightly"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test

  test-1-14-pre-wsl:
    name: DistSSHRun (1.14-pre, WSL2 ubuntu-24.04, x64)
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/wsl-install
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        timeout-minutes: 10
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          # Already registered by ./.github/actions/wsl-install. See
          # wsl-install.ps1 for #43, #96, and #134. This step must not run
          # `wsl --install` or apt-get. A stuck wsl.exe keeps stdio open, so
          # timeout-minutes does not reap it.
          use-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache/wsl-julia
          key: wsl-julia-1.14-pre-${{ hashFiles('Project.toml', 'test/Project.toml', '.github/julia-slots.env') }}
      - name: Pkg.test in WSL2
        shell: wsl-bash {0}
        run: ./.github/wsl-julia.sh '~1.14.0-0' julia --project=. -e 'using Pkg; Pkg.test()'

  test-nightly-wsl:
    name: DistSSHRun (nightly, WSL2 ubuntu-24.04, x64)
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/wsl-install
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        timeout-minutes: 10
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          # Already registered by ./.github/actions/wsl-install. See
          # wsl-install.ps1 for #43, #96, and #134. This step must not run
          # `wsl --install` or apt-get. A stuck wsl.exe keeps stdio open, so
          # timeout-minutes does not reap it.
          use-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache/wsl-julia
          key: wsl-julia-nightly-${{ hashFiles('Project.toml', 'test/Project.toml', '.github/julia-slots.env') }}
      - name: Pkg.test in WSL2
        shell: wsl-bash {0}
        run: ./.github/wsl-julia.sh nightly julia --project=. -e 'using Pkg; Pkg.test()'

  jetls:
    name: JETLS (1.13, ubuntu-latest, x64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: files
        run: echo "list=$(./.github/jetls-check.sh --print-files)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/jetls-check
        with:
          files: ${{ steps.files.outputs.list }}

  aqua:
    name: Aqua (1.13, ubuntu-latest, x64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Aqua.test_all (latest Aqua)
        run: ./.github/aqua-check.sh

  aqua-1-14-pre:
    name: Aqua (1.14-pre, ubuntu-latest, x64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "~1.14.0-0"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Aqua.test_all (latest Aqua)
        run: ./.github/aqua-check.sh

  aqua-nightly:
    name: Aqua (nightly, ubuntu-latest, x64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "nightly"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Aqua.test_all (latest Aqua)
        run: ./.github/aqua-check.sh

  aqua-1-14-pre-macos:
    name: Aqua (1.14-pre, xcode-27, aarch64)
    runs-on: xcode-27
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "~1.14.0-0"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Aqua.test_all (latest Aqua)
        run: ./.github/aqua-check.sh

  aqua-nightly-macos:
    name: Aqua (nightly, xcode-27, aarch64)
    runs-on: xcode-27
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "nightly"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Aqua.test_all (latest Aqua)
        run: ./.github/aqua-check.sh

  aqua-1-14-pre-wsl:
    name: Aqua (1.14-pre, WSL2 ubuntu-24.04, x64)
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/wsl-install
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        timeout-minutes: 10
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          # Already registered by ./.github/actions/wsl-install. See
          # wsl-install.ps1 for #43, #96, and #134. This step must not run
          # `wsl --install` or apt-get. A stuck wsl.exe keeps stdio open, so
          # timeout-minutes does not reap it.
          use-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache/wsl-julia
          key: wsl-julia-1.14-pre-${{ hashFiles('Project.toml', 'test/Project.toml', '.github/julia-slots.env') }}
      - name: Aqua.test_all (latest Aqua)
        shell: wsl-bash {0}
        run: ./.github/wsl-julia.sh '~1.14.0-0' ./.github/aqua-check.sh

  aqua-nightly-wsl:
    name: Aqua (nightly, WSL2 ubuntu-24.04, x64)
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/wsl-install
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        timeout-minutes: 10
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          # Already registered by ./.github/actions/wsl-install. See
          # wsl-install.ps1 for #43, #96, and #134. This step must not run
          # `wsl --install` or apt-get. A stuck wsl.exe keeps stdio open, so
          # timeout-minutes does not reap it.
          use-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache/wsl-julia
          key: wsl-julia-nightly-${{ hashFiles('Project.toml', 'test/Project.toml', '.github/julia-slots.env') }}
      - name: Aqua.test_all (latest Aqua)
        shell: wsl-bash {0}
        run: ./.github/wsl-julia.sh nightly ./.github/aqua-check.sh

  cache-gc:
    needs:
      - test
      - test-macos
      - test-wsl
      - up-test
      - base-test
      - test-1-14-pre
      - test-1-14-pre-macos
      - test-1-14-pre-wsl
      - jetls
      - aqua
      - aqua-1-14-pre
      - aqua-1-14-pre-macos
      - aqua-1-14-pre-wsl
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: cache-gc
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Keep latest cache per ref and restore-key prefix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/cache-gc.sh

  notify:
    needs:
      - test
      - test-macos
      - test-wsl
      - up-test
      - ship-test
      - heartbeat-test
      - base-test
      - jetls
      - aqua
      - cache-gc
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: notify
    permissions:
      issues: write
    steps:
      - name: Open or close tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: CI weekly failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BODY_PREFIX: |+
            Not a PR check. Re-run **CI weekly** after a fix. Downstream is not monitored.

          MONITOR_RESULTS: |
            test:${{ needs.test.result }}
            test-macos:${{ needs.test-macos.result }}
            test-wsl:${{ needs.test-wsl.result }}
            up-test:${{ needs.up-test.result }}
            ship-test:${{ needs.ship-test.result }}
            heartbeat-test:${{ needs.heartbeat-test.result }}
            base-test:${{ needs.base-test.result }}
            jetls:${{ needs.jetls.result }}
            aqua:${{ needs.aqua.result }}
            cache-gc:${{ needs.cache-gc.result }}
        run: bash .github/ci-alert-notify.sh
