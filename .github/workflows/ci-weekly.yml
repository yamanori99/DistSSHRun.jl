name: CI weekly

# Not on pull_request: insurance for 1.13 / 1.14-nightly / Aqua / JETLS
# @release drift when no PR ran that week. PR / main push stay the gate.
# tip jobs are continue-on-error and omitted from notify.
# 1.13 matrix matches Test: DistSSHRun, downstream DistSSHQueue and DistSSHKit,
# DistSSHBase, and DistSSHUp (no coverage).
# 1.14-nightly Pkg.test and Aqua on macOS and WSL2 run here only, and stay
# out of notify. Ubuntu nightly also runs in Test.
on:
  workflow_dispatch:
  # Sunday 10:00 JST (UTC 01:00). Misses E2E weekly (Saturday 19:00 UTC).
  schedule:
    - cron: "0 1 * * 0"

concurrency:
  group: ci-weekly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.title }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: Pkg.test (1.13, ubuntu-latest, x64)
            pkg: DistSSHRun
            kind: run
            os: ubuntu-latest
            wsl: false
          - title: Pkg.test (1.13, macos-latest, aarch64)
            pkg: DistSSHRun
            kind: run
            os: macos-latest
            wsl: false
          - title: Pkg.test (1.13, WSL2 ubuntu-24.04, x64)
            pkg: DistSSHRun
            kind: run
            os: windows-latest
            wsl: true
          - title: Pkg.test (DistSSHQueue, 1.13, ubuntu-latest, x64)
            pkg: DistSSHQueue
            kind: downstream
            os: ubuntu-latest
            wsl: false
          - title: Pkg.test (DistSSHKit, 1.13, ubuntu-latest, x64)
            pkg: DistSSHKit
            kind: downstream
            os: ubuntu-latest
            wsl: false
          - title: Pkg.test (DistSSHBase, 1.13, ubuntu-latest, x64)
            pkg: DistSSHBase
            kind: lib
            os: ubuntu-latest
            wsl: false
          - title: Pkg.test (DistSSHBase, 1.13, macos-latest, aarch64)
            pkg: DistSSHBase
            kind: lib
            os: macos-latest
            wsl: false
          - title: Pkg.test (DistSSHBase, 1.13, WSL2 ubuntu-24.04, x64)
            pkg: DistSSHBase
            kind: lib
            os: windows-latest
            wsl: true
          - title: Pkg.test (DistSSHUp, 1.13, ubuntu-latest, x64)
            pkg: DistSSHUp
            kind: lib
            os: ubuntu-latest
            wsl: false
          - title: Pkg.test (DistSSHUp, 1.13, macos-latest, aarch64)
            pkg: DistSSHUp
            kind: lib
            os: macos-latest
            wsl: false
          - title: Pkg.test (DistSSHUp, 1.13, WSL2 ubuntu-24.04, x64)
            pkg: DistSSHUp
            kind: lib
            os: windows-latest
            wsl: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.kind == 'downstream'
        with:
          repository: yamanori99/${{ matrix.pkg }}.jl
          ref: main
          path: downstream
          persist-credentials: false
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        if: matrix.wsl
        timeout-minutes: 10
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: ca-certificates curl git
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.wsl
        with:
          path: .ci-cache/wsl-julia
          key: wsl-julia-1.13-${{ hashFiles('Project.toml', 'test/Project.toml', '.github/julia-slots.env') }}
      - uses: ./.github/actions/julia-slot
        if: ${{ !matrix.wsl }}
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        if: ${{ !matrix.wsl }}
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test
        if: ${{ matrix.kind == 'run' && !matrix.wsl }}
      - name: Pkg.test ${{ matrix.pkg }}
        if: ${{ matrix.kind == 'lib' && !matrix.wsl }}
        run: julia --project=lib/${{ matrix.pkg }} -e 'using Pkg; Pkg.test()'
      - name: Pkg.test in WSL2
        if: matrix.wsl
        shell: wsl-bash {0}
        run: ./.github/wsl-julia.sh 1.13 julia --project=${{ matrix.kind == 'run' && '.' || format('lib/{0}', matrix.pkg) }} -e 'using Pkg; Pkg.test()'
      - name: Pkg.test downstream against this checkout
        if: matrix.kind == 'downstream'
        env:
          PKG: ${{ matrix.pkg }}
          UPSTREAM: ${{ github.workspace }}
          DOWNSTREAM: ${{ github.workspace }}/downstream
          UPSTREAM_PKG: DistSSHRun
        run: |
          julia --startup-file=no -e '
            using Pkg
            upstream = ENV["UPSTREAM"]
            downstream = ENV["DOWNSTREAM"]
            name = Symbol(ENV["UPSTREAM_PKG"])
            Pkg.activate(joinpath(downstream, "test"))
            Pkg.develop(PackageSpec(path = upstream))
            Pkg.instantiate()
            Core.eval(Main, Expr(:using, Expr(:., name)))
            dir = pkgdir(getfield(Main, name))
            dir === nothing && error(string(name, " has no pkgdir"))
            loaded = realpath(dir)
            expected = realpath(upstream)
            loaded == expected || error(string(name, " loaded from ", loaded))
            Pkg.activate(downstream)
            Pkg.test(ENV["PKG"])
          '

  test-tip:
    name: Pkg.test (${{ matrix.pkg }}, 1.14-nightly, ${{ matrix.label }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pkg: [DistSSHRun, DistSSHBase, DistSSHUp]
        host: [ubuntu, macos, wsl]
        include:
          - host: ubuntu
            os: ubuntu-latest
            arch: x64
            label: ubuntu-latest
            wsl: false
          - host: macos
            os: macos-latest
            arch: aarch64
            label: macos-latest
            wsl: false
          - host: wsl
            os: windows-latest
            arch: x64
            label: WSL2 ubuntu-24.04
            wsl: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        if: matrix.wsl
        timeout-minutes: 10
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: ca-certificates curl git
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.wsl
        with:
          path: .ci-cache/wsl-julia
          key: wsl-julia-1.14-nightly-${{ hashFiles('Project.toml', 'test/Project.toml', '.github/julia-slots.env') }}
      - uses: ./.github/actions/julia-slot
        if: ${{ !matrix.wsl }}
        with:
          version: "1.14-nightly"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        if: ${{ !matrix.wsl }}
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/pkg-test
        if: ${{ matrix.pkg == 'DistSSHRun' && !matrix.wsl }}
      - name: Pkg.test ${{ matrix.pkg }}
        if: ${{ matrix.pkg != 'DistSSHRun' && !matrix.wsl }}
        run: julia --project=lib/${{ matrix.pkg }} -e 'using Pkg; Pkg.test()'
      - name: Pkg.test in WSL2
        if: matrix.wsl
        shell: wsl-bash {0}
        run: ./.github/wsl-julia.sh 1.14-nightly julia --project=${{ matrix.pkg == 'DistSSHRun' && '.' || format('lib/{0}', matrix.pkg) }} -e 'using Pkg; Pkg.test()'

  jetls:
    name: JETLS (1.13, ubuntu-latest, x64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: files
        run: echo "list=$(./.github/jetls-check.sh --print-files)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: ./.github/actions/jetls-check
        with:
          files: ${{ steps.files.outputs.list }}

  aqua:
    name: Aqua (1.13, ubuntu-latest, x64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Aqua.test_all (latest Aqua)
        run: ./.github/aqua-check.sh

  aqua-tip:
    name: Aqua (1.14-nightly, ubuntu-latest, x64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.14-nightly"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Aqua.test_all (latest Aqua)
        run: ./.github/aqua-check.sh

  aqua-tip-macos:
    name: Aqua (1.14-nightly, macos-latest, aarch64)
    runs-on: macos-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.14-nightly"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - name: Aqua.test_all (latest Aqua)
        run: ./.github/aqua-check.sh

  aqua-tip-wsl:
    name: Aqua (1.14-nightly, WSL2 ubuntu-24.04, x64)
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        timeout-minutes: 10
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: ca-certificates curl git
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache/wsl-julia
          key: wsl-julia-1.14-nightly-${{ hashFiles('Project.toml', 'test/Project.toml', '.github/julia-slots.env') }}
      - name: Aqua.test_all (latest Aqua)
        shell: wsl-bash {0}
        run: ./.github/wsl-julia.sh 1.14-nightly ./.github/aqua-check.sh

  cache-gc:
    needs:
      - test
      - test-tip
      - jetls
      - aqua
      - aqua-tip
      - aqua-tip-macos
      - aqua-tip-wsl
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: cache-gc
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep latest cache per ref and restore-key prefix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/cache-gc.sh

  notify:
    needs:
      - test
      - jetls
      - aqua
      - cache-gc
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: notify
    permissions:
      issues: write
    steps:
      - name: Open or close tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED: ${{ contains(join(needs.*.result, ','), 'failure') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='CI weekly failed'
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label alert --search "in:title $title" --json number --jq '.[0].number // empty')"
          if [ "$FAILED" = "true" ]; then
            body="Latest run: $RUN_URL

          Not a PR check. Re-run **CI weekly** after a fix."
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label alert --body "$body"
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Latest run succeeded: $RUN_URL"
          fi
