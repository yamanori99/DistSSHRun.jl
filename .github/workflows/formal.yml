# Lean 4 formal model: independent of the Julia Test matrix.
name: Formal

on:
  pull_request:
    paths:
      - "formal/**"
      - "lib/DistSSHBase/src/ssh/shell_status.jl"
      - ".github/workflows/formal.yml"
  push:
    branches:
      - main
    paths:
      - "formal/**"
      - "lib/DistSSHBase/src/ssh/shell_status.jl"
      - ".github/workflows/formal.yml"
  workflow_dispatch:

concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  lean:
    name: Lean formal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache elan toolchains
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: elan-toolchain-cache
        with:
          path: ~/.elan
          key: formal-elan-${{ hashFiles('formal/lean-toolchain', 'formal/ci/elan-pin.env') }}
          restore-keys: |
            formal-elan-

      - name: Cache Lake build (formal/.lake)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: formal/.lake
          key: formal-lake-${{ hashFiles('formal/lean-toolchain', 'formal/lake-manifest.json', 'formal/**/*.lean', 'formal/lakefile.toml') }}
          restore-keys: |
            formal-lake-${{ hashFiles('formal/lean-toolchain', 'formal/lake-manifest.json', 'formal/lakefile.toml') }}-
            formal-lake-

      - name: Install elan
        run: |
          set -euo pipefail
          # shellcheck source=formal/ci/elan-pin.env
          source formal/ci/elan-pin.env
          if [[ -x "${HOME}/.elan/bin/elan" ]]; then
            echo "elan already installed (cache hit); skipping bootstrap"
          else
            curl -sSfL "$ELAN_INIT_URL" -o elan-init.sh
            echo "${ELAN_INIT_SHA256}  elan-init.sh" | sha256sum -c -
            sh elan-init.sh -y --default-toolchain none --no-modify-path
            rm -f elan-init.sh
          fi
          echo "${HOME}/.elan/bin" >>"$GITHUB_PATH"

      - name: Select Lean toolchain
        working-directory: formal
        run: |
          elan toolchain install "$(cat lean-toolchain)"

      - name: Install PyYAML for bug schema check
        run: python3 -m pip install --user pyyaml

      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.13"

      - name: Audit (build, escapes, registry, coverage, bugs)
        run: bash formal/scripts/audit.sh

      - name: Refutation reproducers
        run: bash formal/scripts/run-repros.sh

      - name: Differential test
        run: julia --project=lib/DistSSHBase formal/diff/shell_status.jl