name: E2E weekly

# Not on pull_request: skipped macOS/WSL jobs would show on every PR, and
# job-name expressions do not expand when skipped.
# Daily 04:00 JST and workflow_dispatch. A version-and-NEWS main push
# does not start this matrix. Register from cut PR Linux E2E.
# `cut-hold` when scheduled Linux is red. Intel / WSL do not add it.
on:
  workflow_dispatch:
  # Daily 04:00 JST (UTC 19:00). Misses CI weekly (daily 06:00 JST).
  # GitHub often delays cron; start early so it still finishes before morning.
  schedule:
    - cron: "0 19 * * *"

concurrency:
  group: ssh-e2e-weekly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: ubuntu-latest (image)
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
      - name: docker-ssh build + push
        env:
          DISTSSHKIT_PUSH_IMAGE: ghcr.io/${{ github.repository_owner }}/distsshrun-linux-ssh-worker:${{ github.sha }}
          DISTSSHKIT_SKIP_UP: "1"
        run: ./testenv/docker-ssh/scripts/up.sh
      - name: Teardown workers
        if: always()
        run: ./testenv/docker-ssh/scripts/down.sh || true

  linux-e2e:
    needs: linux-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: ubuntu-latest → ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # Codecov OIDC (E2E coverage; not on PR E2E)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
      - name: docker-ssh up + SSH E2E
        id: e2e
        env:
          DISTSSHKIT_WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/distsshrun-linux-ssh-worker:${{ github.sha }}
          DISTSSHKIT_WORKER_PULL_RETRIES: "8"
          DISTSSHKIT_CODE_COVERAGE: "1"
        run: ./testenv/docker-ssh/scripts/up.sh --e2e
      - uses: ./.github/actions/e2e-codecov
        if: ${{ always() && steps.e2e.outcome == 'success' }}
      # SHA from the image job; latest after this Linux suite (package should be public).
      - name: Push latest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/distsshrun-linux-ssh-worker
        run: |
          docker tag "${IMAGE}:${{ github.sha }}" local/linux-ssh-worker:latest
          ./testenv/docker-ssh/scripts/push-image.sh "${IMAGE}:latest"
      - name: Teardown workers
        if: always()
        run: ./testenv/docker-ssh/scripts/down.sh || true

  macos-e2e:
    needs: linux-image
    runs-on: macos-15-intel
    # 2026-10-15 finished the suite in 88 min and failed the heartbeat wait.
    # A 240s wait needs room past that.
    timeout-minutes: 120
    name: macos-15-intel → ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
      - name: Colima
        run: ./testenv/docker-ssh/scripts/setup-colima-ci.sh
      - name: Log in to GHCR
        run: |
          attempt=1
          max=5
          delay=5
          until echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin; do
            if (( attempt >= max )); then
              echo "docker login failed after ${max} attempts" >&2
              exit 1
            fi
            echo "docker login failed (${attempt}/${max}); retrying in ${delay}s" >&2
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
      - name: docker-ssh up + SSH E2E
        env:
          DISTSSHKIT_WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/distsshrun-linux-ssh-worker:${{ github.sha }}
          DISTSSHKIT_WORKER_PULL_RETRIES: "8"
        run: ./testenv/docker-ssh/scripts/up.sh --e2e
      - name: Teardown workers
        if: always()
        run: ./testenv/docker-ssh/scripts/down.sh || true

  wsl-e2e:
    needs: linux-image
    runs-on: windows-latest
    timeout-minutes: 60
    name: windows-latest (WSL2) → ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        timeout-minutes: 10
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          # Cache the rootfs. Do not apt-get in this action: a stuck wsl.exe
          # keeps stdio open, so this step's timeout-minutes does not reap it.
          use-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache/wsl-julia
          # root's depot. Pkg.test uses wsl-julia-1.13, so /root paths stay here.
          key: wsl-julia-${{ hashFiles('Project.toml', 'test/Project.toml', '.github/julia-slots.env') }}
      - name: GHCR token for WSL
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          mkdir -p .ci-cache
          printf '%s' "$GHCR_TOKEN" > .ci-cache/ghcr.token
          printf '%s' "$GHCR_ACTOR" > .ci-cache/ghcr.actor
      # wsl-bash does not inherit Actions env (set -u → unbound GITHUB_TOKEN).
      - name: docker-ssh up + SSH E2E in WSL2
        shell: wsl-bash -u root {0}
        run: |
          bash ./.github/wsl-apt.sh ca-certificates curl git rsync openssh-client docker.io docker-compose-v2 iptables
          src="$(pwd)"
          dest="$HOME/DistSSHRun.jl"
          cache="$src/.ci-cache/wsl-julia"
          export DISTSSHKIT_WORKER_IMAGE="ghcr.io/${{ github.repository_owner }}/distsshrun-linux-ssh-worker:${{ github.sha }}"
          export DISTSSHKIT_WORKER_PULL_RETRIES="8"
          mkdir -p "$cache"
          rm -rf "$dest"
          git clone "$src" "$dest"
          if ! docker info >/dev/null 2>&1; then
            dockerd >/tmp/dockerd.log 2>&1 &
            ok=0
            for _ in $(seq 1 60); do
              if docker info >/dev/null 2>&1; then
                ok=1
                break
              fi
              sleep 2
            done
            if [[ "$ok" -ne 1 ]]; then
              cat /tmp/dockerd.log
              exit 1
            fi
          fi
          actor="$(cat "$src/.ci-cache/ghcr.actor")"
          echo "$(cat "$src/.ci-cache/ghcr.token")" | docker login ghcr.io -u "$actor" --password-stdin
          rm -f "$src/.ci-cache/ghcr.token" "$src/.ci-cache/ghcr.actor"
          if [[ -f "$cache/julia.tgz" ]]; then
            tar -xzf "$cache/julia.tgz" -C "$HOME"
          else
            # shellcheck source=/dev/null
            source "$dest/testenv/docker-ssh/scripts/retry.sh"
            _distsshkit_retry "WSL juliaup install" _distsshkit_install_juliaup 1.13
            # Channel must match the stable line in .github/julia-slots.env
          fi
          export PATH="$HOME/.juliaup/bin:$PATH"
          cd "$dest"
          ./testenv/docker-ssh/scripts/up.sh --e2e
          if [[ -d "$HOME/.julia" ]]; then
            tar -czf "$cache/julia.tgz" -C "$HOME" .juliaup .julia
          else
            tar -czf "$cache/julia.tgz" -C "$HOME" .juliaup
          fi
      - name: Teardown workers
        if: always()
        shell: wsl-bash -u root {0}
        run: |
          src="$(pwd)"
          rm -f "$src/.ci-cache/ghcr.token"
          dest="$HOME/DistSSHRun.jl"
          if [[ -d "$dest" ]]; then
            (cd "$dest" && ./testenv/docker-ssh/scripts/down.sh) || true
          fi

