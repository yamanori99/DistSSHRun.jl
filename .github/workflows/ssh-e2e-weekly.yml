          bash ./.github/wsl-apt.sh ca-certificates curl git rsync openssh-client docker.io docker-compose-v2 iptables
          src="$(pwd)"
          dest="$HOME/DistSSHRun.jl"
          cache="$src/.ci-cache/wsl-julia"
          export DISTSSHKIT_WORKER_IMAGE="ghcr.io/${{ github.repository_owner }}/distsshrun-linux-ssh-worker:${{ github.sha }}"
          export DISTSSHKIT_WORKER_PULL_RETRIES="8"
          export DISTSSHKIT_SSH_E2E=1
          mkdir -p "$cache"
          rm -rf "$dest"
          git clone "$src" "$dest"
          if ! docker info >/dev/null 2>&1; then
            dockerd >/tmp/dockerd.log 2>&1 &
            ok=0
            for _ in $(seq 1 60); do
              if docker info >/dev/null 2>&1; then
                ok=1
                break
              fi
              sleep 2
            done
            if [[ "$ok" -ne 1 ]]; then
              cat /tmp/dockerd.log
              exit 1
            fi
          fi
          actor="$(cat "$src/.ci-cache/ghcr.actor")"
          echo "$(cat "$src/.ci-cache/ghcr.token")" | docker login ghcr.io -u "$actor" --password-stdin
          rm -f "$src/.ci-cache/ghcr.token" "$src/.ci-cache/ghcr.actor"
          if [[ -f "$cache/julia.tgz" ]]; then
            tar -xzf "$cache/julia.tgz" -C "$HOME"
          else
            # shellcheck source=/dev/null
            source "$dest/testenv/docker-ssh/scripts/retry.sh"
            _distsshkit_retry "WSL juliaup install" _distsshkit_install_juliaup 1.13
          fi
          export PATH="$HOME/.juliaup/bin:$PATH"
          cd "$dest"
          ./testenv/docker-ssh/scripts/up.sh
          julia --project=lib/DistSSHBase lib/DistSSHBase/test/e2e.jl
          if [[ -d "$HOME/.julia" ]]; then
            tar -czf "$cache/julia.tgz" -C "$HOME" .juliaup .julia
          else
            tar -czf "$cache/julia.tgz" -C "$HOME" .juliaup
          fi
      - name: Teardown workers
        if: always()
        shell: wsl-bash -u root {0}
        run: |
          src="$(pwd)"
          rm -f "$src/.ci-cache/ghcr.token"
          dest="$HOME/DistSSHRun.jl"
          if [[ -d "$dest" ]]; then
            (cd "$dest" && ./testenv/docker-ssh/scripts/down.sh) || true
          fi

  # Queue host loads this checkout. Does not wait for this repo's worker image.
  # Workers stay on General DistSSHRun in the published Queue image. Linux only.
  queue-ssh-e2e:
    name: Downstream SSH E2E (DistSSHQueue, 1.13)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yamanori99/DistSSHQueue.jl
          ref: main
          path: downstream
          persist-credentials: false
      - name: docker-ssh up + SSH E2E
        working-directory: downstream
        env:
          DISTSSHQUEUE_DEV_RUN: ${{ github.workspace }}
          DISTSSHQUEUE_WORKER_IMAGE: ghcr.io/yamanori99/distsshqueue-linux-ssh-worker:latest
          DISTSSHQUEUE_WORKER_PULL_RETRIES: "8"
        run: ./testenv/docker-ssh/scripts/up.sh --e2e
      - name: Teardown workers
        if: always()
        run: |
          if [[ -d downstream ]]; then
            (cd downstream && ./testenv/docker-ssh/scripts/down.sh) || true
          fi

  # Schedule / post-cut runs are not PR checks, and github-actions[bot] does not email.
  notify:
    needs: [linux-image, linux-e2e, macos-e2e, wsl-e2e, up-linux-e2e, up-macos-e2e, up-wsl-e2e, base-linux-e2e, base-macos-e2e, base-wsl-e2e, queue-ssh-e2e]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: notify
    permissions:
      issues: write
    steps:
      - name: Open or close tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED: ${{ contains(join(needs.*.result, ','), 'failure') }}
          LINUX_FAILED: ${{ needs.linux-image.result == 'failure' || needs.linux-e2e.result == 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEEKLY: ${{ github.event_name == 'schedule' }}
        run: |
          title='E2E weekly failed'
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label alert --search "in:title $title" --json number --jq '.[0].number // empty')"
          if [ "$FAILED" = "true" ]; then
            body="Latest run: $RUN_URL

          Not a PR check. Re-run **E2E weekly** after a fix. A red **Linux** job on a scheduled run adds \`cut-hold\` (do not register). Intel / WSL red does not."
            labels=alert
            hold=false
            if [ "$WEEKLY" = "true" ] && [ "$LINUX_FAILED" = "true" ]; then
              labels=alert,cut-hold
              hold=true
            fi
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
              if [ "$hold" = "true" ]; then
                gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --add-label cut-hold
              else
                gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --remove-label cut-hold || true
              fi
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label "$labels" --body "$body"
            fi
          else
            for t in 'E2E weekly failed' 'E2E daily failed'; do
              n="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label alert --search "in:title $t" --json number --jq '.[0].number // empty')"
              if [ -n "$n" ]; then
                gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --remove-label cut-hold || true
                gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Latest run succeeded: $RUN_URL"
              fi
            done
          fi
