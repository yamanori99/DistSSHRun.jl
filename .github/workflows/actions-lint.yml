name: Actions lint

# actionlint, zizmor, and pinact on workflow files. The generated job
# shellchecks remote sh that this package builds.
#
# Versions Dependabot can bump live under .github/actions-lint/
# (go.mod / go.sum / requirements.txt). ShellCheck stays on Ubuntu apt.
# Install paths avoid GitHub Releases (release-asset CDN 504s). No token:
# zizmor stays offline, and pinact only checks that each uses: is a full
# commit SHA.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  lint:
    name: actionlint, zizmor, pinact
    runs-on: ubuntu-latest
    # go install compiles actionlint and pinact from module source.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .github/actions-lint/go.mod
          cache-dependency-path: .github/actions-lint/go.sum
      - name: actionlint, zizmor, and pinact
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-pip
          shellcheck --version

          # Versions come from .github/actions-lint/{go.mod,requirements.txt}.
          # Omit @version on go install so the module selection is used.
          (
            cd .github/actions-lint
            go install github.com/rhysd/actionlint/cmd/actionlint \
              github.com/suzuki-shunsuke/pinact/v5/cmd/pinact
            python3 -m pip install --user --break-system-packages -r requirements.txt
          )
          # SC2155: split declare/assign so a failed `go env` is not masked.
          go_bin="$(go env GOPATH)/bin"
          export PATH="${go_bin}:${HOME}/.local/bin:${PATH}"

          actionlint -version
          zizmor --version
          pinact version || true

          # 1.7.12 rejects concurrency.queue, which Documentation.yml uses on purpose.
          actionlint -ignore 'unexpected key "queue" for "concurrency"'
          zizmor --offline --no-progress .github
          # v5 rejects `pinact run --check --no-api`. --check is the alias, but
          # --no-api still requires --fix=false.
          pinact run --fix=false --no-api

  generated:
    name: shellcheck generated
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
      - name: shellcheck generated remote sh
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version
          out="${RUNNER_TEMP}/generated-sh"
          mkdir -p "$out"
          julia --project=. --startup-file=no .github/shellcheck-generated.jl "$out"
          shopt -s nullglob
          files=("$out"/*.sh)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no generated scripts" >&2
            exit 1
          fi
          fail=0
          for f in "${files[@]}"; do
            echo "== $(basename "$f") =="
            # SC2016 notes that $(...) inside single quotes does not expand.
            # The fixtures include that text so a missing quote is a parse error.
            if ! shellcheck -s sh -e SC2016 - < "$f"; then
              fail=1
            fi
          done
          exit "$fail"
