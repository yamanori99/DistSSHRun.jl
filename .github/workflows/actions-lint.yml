name: Actions lint

# actionlint, zizmor, and pinact on workflow files. The generated job
# shellchecks remote sh that this package builds. ShellCheck comes from
# Ubuntu apt. actionlint and pinact come from `go install` via
# proxy.golang.org; zizmor comes from PyPI. None of these use GitHub
# Releases (avoids release-asset CDN 504s). No token: zizmor stays
# offline, and pinact only checks that each uses: is a full commit SHA.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  lint:
    name: actionlint, zizmor, pinact
    runs-on: ubuntu-latest
    # go install compiles actionlint and pinact from module source.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint, zizmor, and pinact
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-pip
          shellcheck --version

          # Go toolchain from go.dev (not GitHub Releases). pinact@v5 needs Go ≥1.27.1.
          go_ver=1.27.3
          go_sum=65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40
          go_archive="${RUNNER_TEMP}/go${go_ver}.linux-amd64.tar.gz"
          curl -fsSL --connect-timeout 30 --retry 8 --retry-all-errors \
            --retry-max-time 180 -o "$go_archive" \
            "https://go.dev/dl/go${go_ver}.linux-amd64.tar.gz"
          echo "${go_sum}  ${go_archive}" | sha256sum -c -
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf "$go_archive"
          export PATH="/usr/local/go/bin:${PATH}"
          export GOPATH="${RUNNER_TEMP}/gopath"
          export GOBIN="${GOPATH}/bin"
          mkdir -p "$GOBIN"
          export PATH="${GOBIN}:${HOME}/.local/bin:${PATH}"

          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/suzuki-shunsuke/pinact/v5/cmd/pinact@v5.0.0
          python3 -m pip install --user --break-system-packages "zizmor==1.30.1"

          actionlint -version
          zizmor --version
          pinact --version

          # 1.7.12 rejects concurrency.queue, which Documentation.yml uses on purpose.
          actionlint -ignore 'unexpected key "queue" for "concurrency"'
          zizmor --offline --no-progress .github
          # v5 rejects `pinact run --check --no-api`. --check is the alias, but
          # --no-api still requires --fix=false.
          pinact run --fix=false --no-api

  generated:
    name: shellcheck generated
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/julia-slot
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
          delete-old-caches: false
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
      - name: shellcheck generated remote sh
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version
          out="${RUNNER_TEMP}/generated-sh"
          mkdir -p "$out"
          julia --project=. --startup-file=no .github/shellcheck-generated.jl "$out"
          shopt -s nullglob
          files=("$out"/*.sh)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no generated scripts" >&2
            exit 1
          fi
          fail=0
          for f in "${files[@]}"; do
            echo "== $(basename "$f") =="
            # SC2016 notes that $(...) inside single quotes does not expand.
            # The fixtures include that text so a missing quote is a parse error.
            if ! shellcheck -s sh -e SC2016 - < "$f"; then
              fail=1
            fi
          done
          exit "$fail"
