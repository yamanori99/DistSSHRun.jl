name: Docs

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
  # Manual rebuild (e.g. `gh workflow run Docs --ref v0.2.0`) if a tag skipped Docs.
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      heavy: ${{ steps.heavy.outputs.heavy }}
      docs: ${{ steps.heavy.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-heavy
        id: heavy

  build:
    name: Documenter (1.13, ubuntu-latest, x64)
    needs: detect
    if: github.event_name == 'pull_request' && (needs.detect.outputs.heavy == 'true' || needs.detect.outputs.docs == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
      - name: Install docs dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.Registry.add("General")
            Pkg.instantiate()
          '
      - name: Doctests
        run: |
          julia --project=docs -e '
            using Documenter, DistSSHRun, Test
            DocMeta.setdocmeta!(DistSSHRun, :DocTestSetup, :(using DistSSHRun); recursive=true)
            doctest(DistSSHRun)
          '
      - name: Build docs
        run: julia --project=docs --color=yes docs/make.jl

  deploy:
    name: Deploy docs
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # All deploys write gh-pages. Per-ref workflow concurrency does not cover that.
    # queue: max keeps every pending deploy. The default (single) drops the
    # older pending run when a third one arrives, so a tag can skip.
    concurrency:
      group: docs-gh-pages
      cancel-in-progress: false
      # actionlint 1.7.12 does not know concurrency.queue yet. GitHub does.
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1.13"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-scratchspaces: false
      - name: Install docs dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.Registry.add("General")
            Pkg.instantiate()
          '
      - name: Doctests
        run: |
          julia --project=docs -e '
            using Documenter, DistSSHRun, Test
            DocMeta.setdocmeta!(DistSSHRun, :DocTestSetup, :(using DistSSHRun); recursive=true)
            doctest(DistSSHRun)
          '
      - name: Build and deploy
        env:
          # Deploy via HTTPS + contents:write (no DOCUMENTER_KEY SSH secret required).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs --color=yes docs/make.jl
